      <text x="0" y="52" class="font-mono" font-size="16px" fill="#64748b">65e/22f</text>

      <rect x="150" y="10" width="320" height="38" fill="#166534" rx="6" />
      <text x="310" y="35" class="font-mono" font-weight="700" font-size="20px" fill="#ffffff" text-anchor="middle">Safe 1,3,5</text>
      <rect x="476" y="10" width="60" height="38" fill="#1e3a8a" rx="6" />
      <text x="506" y="35" class="font-mono" font-weight="700" font-size="20px" fill="#ffffff" text-anchor="middle">#22</text>

      <text x="680" y="36" class="font-sans" font-weight="800" font-size="24px" fill="#4ade80">88%</text>
      <text x="790" y="36" class="font-sans" font-weight="800" font-size="24px" fill="#4ade80">18%</text>
      <text x="900" y="36" class="font-sans" font-weight="900" font-size="24px" fill="#ef4444">KO!</text>
    </g>

    <!-- Iron Head -->
