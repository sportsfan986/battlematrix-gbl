      <text x="320" y="24" class="font-mono" font-size="22px" fill="#e2e8f0">D: 🟢 🟢 🟢 | L: ⚪ ⚪ ⚪ | K: 🟢 🟢 ⚪</text>

      <text x="0" y="62" class="font-sans" font-weight="800" font-size="24px" fill="#ffffff">#2 Zacian (Crowned)</text>
      <text x="320" y="62" class="font-mono" font-size="22px" fill="#e2e8f0">D: 🔴 🔴 🔴 | L: ⚪ ⚪ ⚪ | K: 🟢 🟢 ⚪</text>

      <text x="0" y="100" class="font-sans" font-weight="800" font-size="24px" fill="#ffffff">#3 Kyurem (White)</text>
