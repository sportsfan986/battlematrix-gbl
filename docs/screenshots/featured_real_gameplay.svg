    <rect width="1030" height="980" fill="url(#hudGlass)" stroke="#38bdf8" stroke-width="3" rx="24" />

    <!-- Top Overlay Header -->
    <g transform="translate(30, 50)">
      <text x="0" y="0" class="font-sans" font-weight="900" font-size="32px" fill="#facc15">✖ VS MEWTWO</text>
      <text x="280" y="0" class="font-mono" font-weight="700" font-size="28px" fill="#fbbf24">[PC 2t/9e/1%]</text>
      
      <rect x="640" y="-32" width="330" height="48" fill="#166534" rx="10" />
      <text x="805" y="0" class="font-sans" font-weight="800" font-size="24px" fill="#4ade80" text-anchor="middle">You: DB 1t/3e/3%</text>
    </g>

    <!-- Overlay Quick Buttons -->
    <g transform="translate(30, 95)">
      <rect x="0" y="0" width="150" height="42" fill="#334155" rx="8" />
      <text x="75" y="27" class="font-sans" font-weight="700" font-size="18px" fill="#fca5a5" text-anchor="middle">↺ Reset Opp</text>

      <rect x="162" y="0" width="160" height="42" fill="#334155" rx="8" />
      <text x="242" y="27" class="font-sans" font-weight="700" font-size="18px" fill="#ffffff" text-anchor="middle">Shadow: OFF</text>

      <rect x="334" y="0" width="160" height="42" fill="#0284c7" rx="8" />
      <text x="414" y="27" class="font-sans" font-weight="700" font-size="18px" fill="#ffffff" text-anchor="middle">Form: Base</text>

      <rect x="506" y="0" width="140" height="42" fill="#0284c7" rx="8" />
      <text x="576" y="27" class="font-sans" font-weight="700" font-size="18px" fill="#ffffff" text-anchor="middle">Dialga</text>

      <rect x="658" y="0" width="140" height="42" fill="#334155" rx="8" />
      <text x="728" y="27" class="font-sans" font-weight="700" font-size="18px" fill="#ffffff" text-anchor="middle">Lugia</text>

      <rect x="810" y="0" width="140" height="42" fill="#334155" rx="8" />
      <text x="880" y="27" class="font-sans" font-weight="700" font-size="18px" fill="#ffffff" text-anchor="middle">Kyogre</text>
