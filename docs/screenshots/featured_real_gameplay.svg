<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 2280" width="100%" height="100%">
  <defs>
    <!-- Realistic Sky Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="30%" stop-color="#93c5fd" />
      <stop offset="55%" stop-color="#e0f2fe" />
      <stop offset="70%" stop-color="#86efac" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>

    <!-- Arena Ground Gradient -->
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="30%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Translucent HUD Glass Overlay -->
    <linearGradient id="hudGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(15, 23, 42, 0.90)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.94)" />
    </linearGradient>

    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .font-mono { font-family: "SF Mono", Consolas, "Courier New", monospace; }
      .text-white { fill: #ffffff; }
      .text-gray { fill: #94a3b8; }
      .text-green { fill: #4ade80; }
      .text-red { fill: #f87171; }
      .text-yellow { fill: #facc15; }
      .text-cyan { fill: #38bdf8; }
    </style>
  </defs>

  <!-- Background Mobile Screen Frame -->
  <rect width="1080" height="2280" fill="#090d16" />

  <!-- Pokemon GO Arena Field -->
  <rect x="0" y="0" width="1080" height="1500" fill="url(#skyGrad)" />
  <polygon points="0,1100 1080,1100 1080,2280 0,2280" fill="url(#groundGrad)" />

  <!-- Arena Lines & Trees -->
  <path d="M 0 1100 Q 540 1050 1080 1100" stroke="#22c55e" stroke-width="20" fill="none" opacity="0.6" />
  <path d="M 100 1400 L 980 1400 M 200 1650 L 880 1650 M 50 1900 L 1030 1900" stroke="#94a3b8" stroke-width="6" opacity="0.4" />
  <path d="M 540 1100 L 100 2280 M 540 1100 L 980 2280" stroke="#94a3b8" stroke-width="6" opacity="0.4" />

  <!-- Pokemon GO Top Status Bar -->
  <!-- Left Side: Active Dialga -->
  <g transform="translate(40, 80)">
    <rect x="0" y="0" width="460" height="120" fill="rgba(255,255,255,0.85)" rx="20" />
    <text x="24" y="52" class="font-sans" font-weight="800" font-size="34px" fill="#0f172a">Dialga</text>
    <text x="280" y="52" class="font-sans" font-weight="800" font-size="30px" fill="#0284c7">CP 4624</text>
    
    <!-- HP Bar -->
    <rect x="24" y="70" width="412" height="20" fill="#cbd5e1" rx="10" />
    <rect x="24" y="70" width="412" height="20" fill="#22c55e" rx="10" />

    <!-- Shields & Balls -->
    <circle cx="36" cy="115" r="14" fill="#ef4444" stroke="#ffffff" stroke-width="3" />
    <circle cx="72" cy="115" r="14" fill="#ef4444" stroke="#ffffff" stroke-width="3" />
    <circle cx="108" cy="115" r="14" fill="#ef4444" stroke="#ffffff" stroke-width="3" />
    <rect x="140" y="103" width="24" height="24" fill="#c084fc" rx="4" />
    <rect x="172" y="103" width="24" height="24" fill="#c084fc" rx="4" />
  </g>

  <!-- Right Side: Opponent Mewtwo -->
  <g transform="translate(580, 80)">
    <rect x="0" y="0" width="460" height="120" fill="rgba(255,255,255,0.85)" rx="20" />
    <text x="436" y="52" class="font-sans" font-weight="800" font-size="34px" fill="#0f172a" text-anchor="end">Mewtwo</text>
    <text x="180" y="52" class="font-sans" font-weight="800" font-size="30px" fill="#d97706" text-anchor="end">CP 4144</text>
    
    <!-- HP Bar -->
    <rect x="24" y="70" width="412" height="20" fill="#cbd5e1" rx="10" />
    <rect x="24" y="70" width="412" height="20" fill="#22c55e" rx="10" />

    <!-- Shields & Balls -->
    <circle cx="424" cy="115" r="14" fill="#ef4444" stroke="#ffffff" stroke-width="3" />
    <circle cx="388" cy="115" r="14" fill="#ef4444" stroke="#ffffff" stroke-width="3" />
    <circle cx="352" cy="115" r="14" fill="#1e293b" stroke="#facc15" stroke-width="3" />
    <rect x="306" y="103" width="24" height="24" fill="#c084fc" rx="4" />
    <rect x="274" y="103" width="24" height="24" fill="#c084fc" rx="4" />
  </g>

