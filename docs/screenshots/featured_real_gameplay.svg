      <text x="220" y="35" class="font-mono" font-weight="700" font-size="20px" fill="#ffffff" text-anchor="middle">1 - 9</text>
      <rect x="296" y="10" width="60" height="38" fill="#991b1b" rx="6" />
      <text x="326" y="35" class="font-mono" font-weight="700" font-size="20px" fill="#ffffff" text-anchor="middle">#10</text>

      <rect x="370" y="10" width="140" height="38" fill="#1e3a8a" rx="6" />
      <text x="440" y="35" class="font-mono" font-weight="700" font-size="20px" fill="#ffffff" text-anchor="middle">11 - 19</text>
      <rect x="516" y="10" width="60" height="38" fill="#991b1b" rx="6" />
      <text x="546" y="35" class="font-mono" font-weight="700" font-size="20px" fill="#ffffff" text-anchor="middle">#20</text>

      <text x="680" y="36" class="font-sans" font-weight="800" font-size="24px" fill="#4ade80">32%</text>
      <text x="790" y="36" class="font-sans" font-weight="800" font-size="24px" fill="#4ade80">20%</text>
      <text x="900" y="36" class="font-sans" font-weight="800" font-size="24px" fill="#facc15">50%</text>
    </g>

    <!-- Shadow Ball -->
    <g transform="translate(30, 460)">
      <text x="0" y="28" class="font-sans" font-weight="800" font-size="22px" fill="#ffffff">SB</text>
      <text x="0" y="52" class="font-mono" font-size="16px" fill="#64748b">55e/14f</text>

      <rect x="150" y="10" width="220" height="38" fill="#1e3a8a" rx="6" />
      <text x="260" y="35" class="font-mono" font-weight="700" font-size="20px" fill="#ffffff" text-anchor="middle">1 - 13</text>
      <rect x="376" y="10" width="60" height="38" fill="#991b1b" rx="6" />
      <text x="406" y="35" class="font-mono" font-weight="700" font-size="20px" fill="#ffffff" text-anchor="middle">#14</text>

      <text x="680" y="36" class="font-sans" font-weight="800" font-size="24px" fill="#facc15">46%</text>
      <text x="790" y="36" class="font-sans" font-weight="800" font-size="24px" fill="#facc15">48%</text>
      <text x="900" y="36" class="font-sans" font-weight="800" font-size="24px" fill="#facc15">46%</text>
    </g>

    <!-- Focus Blast -->
    <g transform="translate(30, 540)">
      <text x="0" y="28" class="font-sans" font-weight="800" font-size="22px" fill="#ffffff">FB</text>
      <text x="0" y="52" class="font-mono" font-size="16px" fill="#64748b">75e/18f</text>

      <rect x="150" y="10" width="280" height="38" fill="#1e3a8a" rx="6" />
      <text x="290" y="35" class="font-mono" font-weight="700" font-size="20px" fill="#ffffff" text-anchor="middle">1 - 17</text>
      <rect x="436" y="10" width="60" height="38" fill="#991b1b" rx="6" />
      <text x="466" y="35" class="font-mono" font-weight="700" font-size="20px" fill="#ffffff" text-anchor="middle">#18</text>

      <text x="680" y="36" class="font-sans" font-weight="900" font-size="24px" fill="#ef4444">100%</text>
      <text x="790" y="36" class="font-sans" font-weight="800" font-size="24px" fill="#4ade80">18%</text>
      <text x="900" y="36" class="font-sans" font-weight="800" font-size="24px" fill="#ef4444">70%</text>
