  <!-- Right Side In-Game Team Switch Buttons -->
  <g transform="translate(880, 1250)">
    <!-- Switch to Lugia CP 4179 -->
    <rect x="0" y="0" width="160" height="150" fill="rgba(15,23,42,0.85)" stroke="#64748b" stroke-width="3" rx="16" />
    <text x="140" y="30" class="font-sans" font-weight="800" font-size="18px" fill="#ffffff" text-anchor="end">CP 4179</text>
    <!-- Lugia Avatar Circle -->
    <circle cx="80" cy="90" r="40" fill="#38bdf8" opacity="0.6" />
  </g>

  <g transform="translate(880, 1430)">
    <!-- Switch to Kyogre CP 4652 -->
    <rect x="0" y="0" width="160" height="150" fill="rgba(15,23,42,0.85)" stroke="#38bdf8" stroke-width="3" rx="16" />
    <text x="140" y="30" class="font-sans" font-weight="800" font-size="18px" fill="#ffffff" text-anchor="end">CP 4652</text>
    <circle cx="80" cy="90" r="40" fill="#0284c7" opacity="0.6" />
  </g>

  <!-- Bottom In-Game Charged Move Buttons -->
  <g transform="translate(240, 1950)">
    <!-- Roar of Time Charged Button -->
    <circle cx="160" cy="110" r="100" fill="rgba(15, 23, 42, 0.85)" stroke="#38bdf8" stroke-width="8" />
    <text x="160" y="240" class="font-sans" font-weight="900" font-size="28px" fill="#ffffff" text-anchor="middle">ROAR OF TIME</text>

    <!-- Iron Head Charged Button -->
