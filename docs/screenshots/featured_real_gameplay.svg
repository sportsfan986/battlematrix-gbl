      <text x="180" y="20" class="font-mono" font-weight="700" font-size="20px" fill="#cbd5e1">DIA • DB 1t/3e/3%</text>

      <text x="680" y="20" class="font-sans" font-weight="800" font-size="20px" fill="#38bdf8">MEW</text>
      <text x="790" y="20" class="font-sans" font-weight="800" font-size="20px" fill="#94a3b8">ZAC</text>
      <text x="900" y="20" class="font-sans" font-weight="800" font-size="20px" fill="#94a3b8">KYU</text>
