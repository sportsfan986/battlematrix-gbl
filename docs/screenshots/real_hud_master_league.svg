<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 620" width="100%" height="100%">
  <defs>
    <style>
      .overlay-bg { fill: rgba(15, 23, 42, 0.92); stroke: #334155; stroke-width: 1.5; rx: 12; }
      .header-title { font-family: sans-serif; font-weight: 800; font-size: 13px; fill: #facc15; }
      .header-badge { font-family: monospace; font-size: 11px; fill: #4ade80; }
      .btn { fill: #334155; rx: 4; }
      .btn-active { fill: #0284c7; rx: 4; }
      .btn-txt { font-family: sans-serif; font-size: 10px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .row-txt { font-family: sans-serif; font-size: 11px; fill: #f1f5f9; font-weight: 600; }
      .green-dot { fill: #22c55e; }
      .red-x { fill: #ef4444; }
      .cell-green { fill: #166534; rx: 3; }
      .cell-blue { fill: #1e3a8a; rx: 3; }
      .cell-red { fill: #991b1b; rx: 3; }
      .val-txt { font-family: monospace; font-size: 10px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    </style>
  </defs>

  <!-- Overlay Container -->
  <rect x="10" y="10" width="480" height="600" class="overlay-bg" />

  <!-- Top Title & Move Basis Bar -->
  <g transform="translate(20, 25)">
    <text x="0" y="12" class="header-title">✖ VS ZACIAN (CROWNED)</text>
    <text x="180" y="12" font-family="monospace" font-size="11px" fill="#f59e0b">[MC 2t/7e/2%]</text>
    <text x="320" y="12" class="header-badge">You: WF 3t/8e/6%</text>
  </g>

  <!-- Control Buttons -->
  <g transform="translate(20, 48)">
    <rect x="0" y="0" width="80" height="22" class="btn" />
    <text x="40" y="14" class="btn-txt" fill="#fca5a5">↺ Reset Opp</text>

    <rect x="86" y="0" width="80" height="22" class="btn" />
    <text x="126" y="14" class="btn-txt">Shadow: OFF</text>

    <rect x="172" y="0" width="85" height="22" class="btn-active" />
    <text x="214" y="14" class="btn-txt">Form: Crowned</text>

    <rect x="263" y="0" width="60" height="22" class="btn" />
    <text x="293" y="14" class="btn-txt">Dialga</text>

    <rect x="328" y="0" width="60" height="22" class="btn" />
    <text x="358" y="14" class="btn-txt">Lugia</text>

    <rect x="393" y="0" width="65" height="22" class="btn-active" />
    <text x="425" y="14" class="btn-txt">Kyogre</text>
  </g>

  <!-- Matchup Matrix -->
  <g transform="translate(20, 82)">
    <!-- Row 1 -->
    <text x="0" y="16" class="row-txt">#1 Zacian (Crowned)</text>
    <text x="160" y="16" font-family="monospace" font-size="11px" fill="#cbd5e1">D: ❌ 🔴 🔴 | L: ⚪ ⚪ ⚪ | K: 🔴 🔴 🔴</text>
    
    <!-- Row 2 -->
    <text x="0" y="36" class="row-txt">#2 Kyurem (White)</text>
    <text x="160" y="36" font-family="monospace" font-size="11px" fill="#cbd5e1">D: 🔴 🔴 🟢 | L: 🔴 🔴 🔴 | K: 🔴 🔴 🔴</text>

    <!-- Row 3 -->
    <text x="0" y="56" class="row-txt">#3 Mewtwo</text>
    <text x="160" y="56" font-family="monospace" font-size="11px" fill="#cbd5e1">D: 🟢 🔴 🔴 | L: 🔴 🔴 🔴 | K: 🔴 🔴 🔴</text>
  </g>

  <!-- Opponent Attacks Header -->
  <g transform="translate(20, 155)">
    <text x="0" y="12" font-family="sans-serif" font-weight="800" font-size="11px" fill="#94a3b8">OPPONENT ATTACKS</text>
    <rect x="200" y="-2" width="65" height="18" fill="#ef4444" rx="3" />
    <text x="232" y="11" class="btn-txt">CMP LOSS</text>
    <text x="280" y="12" font-family="sans-serif" font-weight="700" font-size="10px" fill="#94a3b8">DIA</text>
    <text x="330" y="12" font-family="sans-serif" font-weight="700" font-size="10px" fill="#94a3b8">LUG</text>
    <text x="380" y="12" font-family="sans-serif" font-weight="700" font-size="10px" fill="#94a3b8">KYO</text>
  </g>

  <!-- Opponent Moves -->
  <!-- BehB -->
  <g transform="translate(20, 180)">
    <text x="0" y="15" class="row-txt" font-size="12px">BehB</text>
    <text x="0" y="28" font-family="sans-serif" font-size="10px" fill="#64748b">55e/6f</text>
    <rect x="70" y="6" width="100" height="20" class="cell-blue" />
    <text x="120" y="20" class="val-txt">1 - 5</text>
    <rect x="180" y="6" width="30" height="20" class="cell-red" />
    <text x="195" y="20" class="val-txt">#6</text>
    <text x="280" y="20" class="row-txt" fill="#4ade80">35%</text>
    <text x="330" y="20" class="row-txt" fill="#4ade80">36%</text>
    <text x="380" y="20" class="row-txt" fill="#4ade80">35%</text>
  </g>

  <!-- CC -->
  <g transform="translate(20, 220)">
    <text x="0" y="15" class="row-txt" font-size="12px">CC</text>
    <text x="0" y="28" font-family="sans-serif" font-size="10px" fill="#64748b">45e/5f</text>
    <rect x="70" y="6" width="100" height="20" class="cell-blue" />
    <text x="120" y="20" class="val-txt">1 - 4</text>
    <rect x="180" y="6" width="30" height="20" class="cell-red" />
    <text x="195" y="20" class="val-txt">#5</text>
    <text x="280" y="20" class="row-txt" fill="#ef4444">73%</text>
    <text x="330" y="20" class="row-txt" fill="#4ade80">12%</text>
    <text x="380" y="20" class="row-txt" fill="#facc15">46%</text>
  </g>

  <!-- PR -->
  <g transform="translate(20, 260)">
    <text x="0" y="15" class="row-txt" font-size="12px">PR</text>
    <text x="0" y="28" font-family="sans-serif" font-size="10px" fill="#64748b">60e/6f</text>
    <rect x="70" y="6" width="100" height="20" class="cell-blue" />
    <text x="120" y="20" class="val-txt">1 - 5</text>
    <rect x="180" y="6" width="30" height="20" class="cell-red" />
    <text x="195" y="20" class="val-txt">#6</text>
    <text x="280" y="20" class="row-txt" fill="#facc15">49%</text>
    <text x="330" y="20" class="row-txt" fill="#4ade80">32%</text>
    <text x="380" y="20" class="row-txt" fill="#facc15">49%</text>
  </g>

  <!-- My Attacks Header -->
  <g transform="translate(20, 310)">
    <text x="0" y="12" font-family="sans-serif" font-weight="800" font-size="11px" fill="#38bdf8">MY ATTACKS</text>
    <text x="100" y="12" font-family="monospace" font-size="10px" fill="#94a3b8">KYO • WF 3t/8e/6%</text>
    <text x="280" y="12" font-family="sans-serif" font-weight="700" font-size="10px" fill="#38bdf8">ZAC</text>
    <text x="330" y="12" font-family="sans-serif" font-weight="700" font-size="10px" fill="#94a3b8">KYU</text>
    <text x="380" y="12" font-family="sans-serif" font-weight="700" font-size="10px" fill="#94a3b8">MEW</text>
  </g>

  <!-- My Moves -->
  <!-- OP -->
  <g transform="translate(20, 335)">
    <text x="0" y="15" class="row-txt" font-size="12px">OP</text>
    <text x="0" y="28" font-family="sans-serif" font-size="10px" fill="#64748b">60e/8f</text>
    <rect x="70" y="6" width="100" height="20" class="cell-green" />
    <text x="120" y="20" class="val-txt">Safe 1,3,5</text>
    <rect x="180" y="6" width="30" height="20" class="cell-blue" />
    <text x="195" y="20" class="val-txt">#8</text>
    <text x="280" y="20" class="row-txt" fill="#4ade80">66%</text>
    <text x="330" y="20" class="row-txt" fill="#facc15">42%</text>
    <text x="380" y="20" class="row-txt" fill="#4ade80">77%</text>
  </g>

  <!-- Avl -->
  <g transform="translate(20, 375)">
    <text x="0" y="15" class="row-txt" font-size="12px">Avl</text>
    <text x="0" y="28" font-family="sans-serif" font-size="10px" fill="#64748b">45e/6f</text>
    <rect x="70" y="6" width="100" height="20" class="cell-green" />
    <text x="120" y="20" class="val-txt">Safe 1,3,5</text>
    <rect x="180" y="6" width="30" height="20" class="cell-blue" />
    <text x="195" y="20" class="val-txt">#6</text>
    <text x="280" y="20" class="row-txt" fill="#4ade80">24%</text>
    <text x="330" y="20" class="row-txt" fill="#4ade80">39%</text>
    <text x="380" y="20" class="row-txt" fill="#facc15">45%</text>
  </g>
</svg>
