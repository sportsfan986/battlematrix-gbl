<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 1000" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d131f; }
      .card { fill: #131c2e; stroke: #1e293b; stroke-width: 1; rx: 8; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; fill: #ffffff; font-size: 20px; }
      .subtitle { font-family: sans-serif; font-size: 12px; fill: #94a3b8; }
      .btn-blue { fill: #2563eb; rx: 6; }
      .btn-gray { fill: #334155; rx: 6; }
      .btn-green { fill: #059669; rx: 6; }
      .btn-orange { fill: #d97706; rx: 6; }
      .btn-text { font-family: sans-serif; font-weight: 700; font-size: 13px; fill: #ffffff; text-anchor: middle; }
      .text-sm { font-family: sans-serif; font-size: 12px; fill: #cbd5e1; }
      .text-bold { font-weight: 700; }
      .badge-ul { fill: #eab308; rx: 3; }
      .badge-gl { fill: #0284c7; rx: 3; }
      .badge-ml { fill: #7c3aed; rx: 3; }
      .badge-text { font-family: sans-serif; font-weight: 800; font-size: 10px; fill: #000000; text-anchor: middle; }
      .badge-text-white { font-family: sans-serif; font-weight: 800; font-size: 10px; fill: #ffffff; text-anchor: middle; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="500" height="1000" class="bg" />

  <!-- Top App Bar -->
  <g transform="translate(20, 30)">
    <rect x="0" y="0" width="36" height="36" rx="8" fill="#0284c7" />
    <!-- Hexagon icon -->
    <polygon points="18,6 30,13 30,27 18,34 6,27 6,13" fill="none" stroke="#ffffff" stroke-width="2" />
    <text x="48" y="20" class="title">SilphScope PvP</text>
    <text x="48" y="34" class="subtitle">Real-Time PvP Floating Overlay • v2.12</text>
    <rect x="350" y="6" width="110" height="28" class="btn-orange" />
    <text x="405" y="24" class="btn-text">☕ SUPPORT</text>
  </g>

  <!-- Status Box -->
  <g transform="translate(20, 85)">
    <text x="0" y="15" font-family="sans-serif" font-weight="700" font-size="14px" fill="#38bdf8">Status: Idle</text>
    <text x="0" y="32" class="subtitle">PvPoke Database: Cached (1665 KB offline ready)</text>
    
    <!-- Action Buttons -->
    <rect x="0" y="45" width="220" height="42" class="btn-blue" />
    <text x="110" y="71" class="btn-text">START BATTLE OVERLAY</text>
    
    <rect x="235" y="45" width="225" height="42" class="btn-gray" />
    <text x="347" y="71" class="btn-text">SYNC PVPOKE</text>
  </g>

  <!-- Move Count Basis Card -->
  <g transform="translate(20, 190)">
    <rect x="0" y="0" width="460" height="55" class="card" />
    <text x="12" y="22" font-family="sans-serif" font-weight="700" font-size="13px" fill="#f8fafc">Opponent Move Count Basis</text>
    <text x="12" y="38" font-family="sans-serif" font-size="11px" fill="#64748b">Default: Counts &amp; 50e/Xf relative to My Fast Moves</text>
    <rect x="340" y="12" width="108" height="30" class="btn-blue" />
    <text x="394" y="31" class="btn-text" font-size="11px">MY FASTS</text>
  </g>

  <!-- Overlay Size Slider Card -->
  <g transform="translate(20, 255)">
    <rect x="0" y="0" width="460" height="75" class="card" />
    <text x="12" y="22" font-family="sans-serif" font-weight="700" font-size="13px" fill="#f8fafc">Overlay Size (% of Screen Width)</text>
    <text x="448" y="22" font-family="sans-serif" font-weight="700" font-size="13px" fill="#38bdf8" text-anchor="end">86%</text>
    
    <!-- Slider Track -->
    <line x1="12" y1="42" x2="448" y2="42" stroke="#334155" stroke-width="4" stroke-linecap="round" />
    <line x1="12" y1="42" x2="330" y2="42" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
    <!-- Handle -->
    <circle cx="330" cy="42" r="8" fill="#38bdf8" />
    
    <text x="12" y="62" font-family="sans-serif" font-size="10px" fill="#64748b">50%</text>
    <text x="210" y="62" font-family="sans-serif" font-size="10px" fill="#0284c7" text-anchor="middle">▲ 78% Default</text>
    <text x="448" y="62" font-family="sans-serif" font-size="10px" fill="#64748b" text-anchor="end">100%</text>
  </g>

  <!-- Presets Header -->
  <g transform="translate(20, 350)">
    <text x="0" y="20" class="title" font-size="17px">GBL Team Presets</text>
    <rect x="320" y="0" width="140" height="32" class="btn-green" />
    <text x="390" y="20" class="btn-text">+ NEW TEAM</text>
  </g>

  <!-- Team Card 1: Ultra League -->
  <g transform="translate(20, 395)">
    <rect x="0" y="0" width="460" height="135" class="card" />
    <!-- Radio selection indicator -->
    <circle cx="30" cy="30" r="10" fill="none" stroke="#38bdf8" stroke-width="2" />
    <circle cx="30" cy="30" r="5" fill="#38bdf8" />
    
    <text x="52" y="32" font-family="sans-serif" font-weight="700" font-size="15px" fill="#ffffff">Ultra: Zygarde / Corviknight / Mimikyu</text>
    <rect x="350" y="16" width="98" height="20" class="badge-ul" />
    <text x="399" y="30" class="badge-text">ULTRA LEAGUE</text>

    <text x="52" y="58" class="text-sm">• Zygarde (CP 2472) — Dragon Tail | Crunch, Earthquake</text>
    <text x="52" y="80" class="text-sm">• Corviknight (CP 2499) — Sand Attack | Sky Attack, Iron Head</text>
    <text x="52" y="102" class="text-sm">• Mimikyu (CP 2497) — Shadow Claw | Play Rough, Shadow Sneak</text>
    
    <!-- Edit & Delete icons -->
    <text x="410" y="80" font-family="sans-serif" font-size="16px" fill="#94a3b8">✏️</text>
    <text x="435" y="80" font-family="sans-serif" font-size="16px" fill="#94a3b8">🗑️</text>
  </g>

  <!-- Team Card 2: Great League -->
  <g transform="translate(20, 545)">
    <rect x="0" y="0" width="460" height="145" class="card" />
    <circle cx="30" cy="30" r="10" fill="none" stroke="#64748b" stroke-width="2" />
    
    <text x="52" y="32" font-family="sans-serif" font-weight="700" font-size="15px" fill="#ffffff">Great: Kanto Ninetales / Fearow / ...</text>
    <rect x="348" y="16" width="100" height="20" class="badge-gl" />
    <text x="398" y="30" class="badge-text-white">GREAT LEAGUE</text>

    <text x="52" y="58" class="text-sm">• Kanto Ninetales (CP 1498 · IV 0/13/10) — Ember | Energy Ball...</text>
    <text x="52" y="80" class="text-sm">• Fearow (CP 1500 · IV 3/15/15) — Peck | Drill Run, Drill Peck</text>
    <text x="52" y="102" class="text-sm">• Shadow Pidgeot (CP 1490 · IV 5/14/15) — Gust | Twister, Brave...</text>

    <text x="410" y="80" font-family="sans-serif" font-size="16px" fill="#94a3b8">✏️</text>
    <text x="435" y="80" font-family="sans-serif" font-size="16px" fill="#94a3b8">🗑️</text>
  </g>

  <!-- Team Card 3: Master League -->
  <g transform="translate(20, 705)">
    <rect x="0" y="0" width="460" height="145" class="card" />
    <circle cx="30" cy="30" r="10" fill="none" stroke="#64748b" stroke-width="2" />
    
    <text x="52" y="32" font-family="sans-serif" font-weight="700" font-size="15px" fill="#ffffff">Master Team</text>
    <rect x="338" y="16" width="110" height="20" class="badge-ml" />
    <text x="393" y="30" class="badge-text-white">MASTER LEAGUE</text>

    <text x="52" y="58" class="text-sm">• Dialga Origin (CP 4624 · IV 15/15/15) — Dragon Breath | Roar...</text>
    <text x="52" y="80" class="text-sm">• Lugia (CP 4179 · IV 15/14/15) — Dragon Tail | Aeroblast, Earth...</text>
    <text x="52" y="102" class="text-sm">• Kyogre (CP 4652 · IV 15/15/15) — Waterfall | Origin Pulse, Av...</text>

    <text x="410" y="80" font-family="sans-serif" font-size="16px" fill="#94a3b8">✏️</text>
    <text x="435" y="80" font-family="sans-serif" font-size="16px" fill="#94a3b8">🗑️</text>
  </g>
</svg>
