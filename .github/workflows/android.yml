name: Build Android APK

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Build Target'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
          - both

      workflow_version:
        description: 'Optional release version override (e.g. v1.01)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Release Version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.workflow_version }}" ]; then
            RAW_VER="${{ github.event.inputs.workflow_version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RAW_VER="${{ github.ref_name }}"
          elif [ -f VERSION ]; then
            RAW_VER=$(cat VERSION | tr -d '[:space:]')
          else
            RAW_VER="v1.00"
          fi
          CLEAN_NUM="${RAW_VER#v}"
          TAG_NAME="v${CLEAN_NUM}"
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "version_num=${CLEAN_NUM}" >> $GITHUB_OUTPUT
          echo "Resolved release version: ${TAG_NAME}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: |
          chmod +x gradlew

      - name: Verify or Generate Release Keystore
        run: |
          if [ ! -f app/release.keystore ]; then
            echo "Generating release keystore via keytool..."
            keytool -genkeypair -v \
              -keystore app/release.keystore \
              -alias gblkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass gblrelease123 \
              -keypass gblrelease123 \
              -dname "CN=SilphScope PvP, OU=Android, O=SilphScope, C=US"
          else
            echo "Release keystore is present at app/release.keystore"
          fi

      - name: Build Release APK
        if: github.event.inputs.build_target == 'release' || github.event.inputs.build_target == 'both' || github.event.inputs.build_target == '' || github.event_name == 'push'
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare Named Release APK for Public Download
        if: github.event.inputs.build_target == 'release' || github.event.inputs.build_target == 'both' || github.event.inputs.build_target == '' || github.event_name == 'push'
        run: |
          mkdir -p app/build/outputs/apk/release/named
          cp app/build/outputs/apk/release/*.apk "app/build/outputs/apk/release/named/silphscope-pvp-${{ steps.version.outputs.tag }}.apk"

      - name: Build Debug APK
        if: github.event.inputs.build_target == 'debug' || github.event.inputs.build_target == 'both'
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: silphscope-pvp-release-apk
          path: app/build/outputs/apk/release/named/silphscope-pvp-*.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: silphscope-pvp-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish Official GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "SilphScope PvP ${{ steps.version.outputs.tag }}"
          body: |
            ## SilphScope PvP ${{ steps.version.outputs.tag }} — Official v3.11 Release (Top-100 Role Upgrade Recommendations, Unique Ability Battle Math & ABB/ABC Team Rating Engine)
            
            ### What's New in v3.11 (Merged v3.10 + v3.11 Changelog)
            - **Top-100 Role Upgrade Recommendation Engine (`#1 Lead`, `#2 Safe Swap`, `#3 Closer`)**:
              - Added an on-demand **`✨ Suggest Top-100 Role Upgrades (3 Per Role)`** button inside the Create Team and Edit Team dialogs with **3 one-tap replacement chips** beneath Slot 1, Slot 2, and Slot 3.
              - Simulates the **Top 100 Meta Pokémon** for the active league (including eligible Shadows) while enforcing the **GBL species clause** (no duplicate base species across your 3 slots and at most 1 Mega in Mega Master League).
              - Ranks candidates by combining **Full Team Synergy (`ΔTeamMachBR`)** and **Role Rating Delta (`ΔRoleBR`)** plus defensive coverage bonuses, auto-filling the Pokémon, recommended PvPoke moveset, and CP on a single tap.
            - **Unique Form-Change & Signature Ability Battle Ranking Math (`Morpeko`, `Mimikyu`, `Aegislash`, `Cramorant`)**:
              - **Morpeko (`Hunger Switch` + `Aura Wheel`)**: Models alternating Electric/Dark STAB `Aura Wheel` cycles and its guaranteed `+1 Attack` stage self-buff (`1.25x` compounding up to `2.0x`) across every charged move cycle.
              - **Mimikyu (`Disguise`)**: Models Disguise absorbing the first unshielded incoming Charged Attack for `1 HP` (acting as a free extra shield), followed by the Busted Form `-1 Defense` stage drop (`0.8x` Defense).
              - **Aegislash (`Stance Change: Shield Forme ⇄ Blade Forme`)**: Models Shield Forme (`97 Atk / 291 Def`) tanking damage while generating energy with 1-damage fast moves, transforming into Blade Forme (`291 Atk / 97 Def`) right before firing Charged Attacks, and reverting to Shield Forme when spending a Protect Shield.
              - **Cramorant (`Gulp Missile: Gulping / Gorging Form`)**: Models `Surf` catching Arrokuda (`> 50% HP`) or Pikachu (`≤ 50% HP`), dealing `12.5%` max-HP retaliation damage when attacked and applying `-1 Defense` stage (Gulping Form) or `-1 Attack` stage (Gorging Form).
            - **Non-Blocking Background Evaluation & Instant Team Switching**:
              - Moved heavy team evaluation and Top-100 recommendation simulations onto background worker threads (`Dispatchers.Default`) and memoized per-preset battle ratings so switching teams and opening the Team Editor is instantaneous.
              - Kept slot reordering controls (`#1 ⇄ #2`, `#2 ⇄ #3`, and `⚡ Auto-Detect Style & Order Swap`) exclusively inside the Team Editor modal so the main Team Select screen stays clean and responsive.
            - **Auto Team Style Detection (`ABB` vs. `ABC`) & Safe Swap Slot Reordering**:
              - Evaluates pairwise defensive type vulnerabilities across all 3 team members to classify teams as **ABB** (moving the resisting $A$ Pokémon to Slot 1 Lead, Bait $B_1$ to Slot 2 Safe Swap, and Sweeper $B_2$ to Slot 3 Closer) or **ABC** (keeping Slot 1 Lead fixed and promoting the bench Pokémon with the highest consistency-adjusted Safe Swap index $\mu_{BR} - 0.5\sigma_{BR}$ to Slot 2).
            - **Blended Current-Season Meta Distribution, Position-Weighted Shield Ratings & Per-Slot BR Badges**:
              - Binds historical battle logs strictly to the current GBL season (`0%` to `70%` linear ramp over `0–50` matches + exponential recency decay $W_{\text{log}}(k) = e^{-0.05 \cdot (k - 1)}$).
              - Evaluates role-specific multi-shield expectations for **Lead (`Slot 1`)**, **Safe Swap (`Slot 2`)**, and **Closer (`Slot 3`)**, displaying `[ABB]` / `[ABC]` pills, **Lead BR**, **Machine BR** (with customizable thresholds in Settings), and individual **Swap BR** badges on both Slot 2 and Slot 3.
            
            ### Download & Install
            Download **`silphscope-pvp-${{ steps.version.outputs.tag }}.apk`** from the **Assets** section below and install on your Android device.
          files: |
            app/build/outputs/apk/release/named/silphscope-pvp-${{ steps.version.outputs.tag }}.apk
          draft: false
          prerelease: false
          make_latest: "true"
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

