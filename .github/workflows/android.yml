name: Build Android APK

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Build Target'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
          - both

      workflow_version:
        description: 'Optional release version override (e.g. v1.01)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Release Version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.workflow_version }}" ]; then
            RAW_VER="${{ github.event.inputs.workflow_version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RAW_VER="${{ github.ref_name }}"
          elif [ -f VERSION ]; then
            RAW_VER=$(cat VERSION | tr -d '[:space:]')
          else
            RAW_VER="v1.00"
          fi
          CLEAN_NUM="${RAW_VER#v}"
          TAG_NAME="v${CLEAN_NUM}"
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "version_num=${CLEAN_NUM}" >> $GITHUB_OUTPUT
          echo "Resolved release version: ${TAG_NAME}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: |
          chmod +x gradlew

      - name: Verify or Generate Release Keystore
        run: |
          if [ ! -f app/release.keystore ]; then
            echo "Generating release keystore via keytool..."
            keytool -genkeypair -v \
              -keystore app/release.keystore \
              -alias gblkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass gblrelease123 \
              -keypass gblrelease123 \
              -dname "CN=SilphScope PvP, OU=Android, O=SilphScope, C=US"
          else
            echo "Release keystore is present at app/release.keystore"
          fi

      - name: Build Release APK
        if: github.event.inputs.build_target == 'release' || github.event.inputs.build_target == 'both' || github.event.inputs.build_target == '' || github.event_name == 'push'
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare Named Release APK for Public Download
        if: github.event.inputs.build_target == 'release' || github.event.inputs.build_target == 'both' || github.event.inputs.build_target == '' || github.event_name == 'push'
        run: |
          mkdir -p app/build/outputs/apk/release/named
          cp app/build/outputs/apk/release/*.apk "app/build/outputs/apk/release/named/silphscope-pvp-${{ steps.version.outputs.tag }}.apk"

      - name: Build Debug APK
        if: github.event.inputs.build_target == 'debug' || github.event.inputs.build_target == 'both'
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: silphscope-pvp-release-apk
          path: app/build/outputs/apk/release/named/silphscope-pvp-*.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: silphscope-pvp-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish Official GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "SilphScope PvP ${{ steps.version.outputs.tag }}"
          body: |
            ## SilphScope PvP ${{ steps.version.outputs.tag }} — Official v3.06 Release (Dual-Accent Themes, Shiny Origin Dialga, Full Modal/Button Theming & Interactive Shield Counters)
            
            ### What's New in v3.06 (Theme Overhaul, Complete UI/Modal Theming & Page Transparency)
            - **New ✨ Shiny Origin Forme Dialga Midnight Theme (`dialga_shiny_midnight`)**:
              - Replaced legacy AMOLED Cyber Pulse Cyan & Matrix Phosphor Green themes with **✨ Shiny Origin Dialga Midnight (Dark)** featuring a deep cosmic void canvas (`#050B16`), Shiny Origin Dialga's luminous Temporal Teal primary accent (`#2DD4BF`), Astral Ring Gold secondary accent (`#FACC15`), and a custom vector Origin Forme Dialga crest & diamond core watermark.
            - **Dual-Accent Color Palettes Across All 9 Themes**:
              - Added a distinct secondary accent color (`secondaryAccentColor` / `secondaryButtonColor` + 5-dot swatch preview in Settings) to every theme for richer depth across headers, badges, slot titles, and action buttons:
                - **🎀 Sylveon Fairy Ribbon**: Paired Fairy Ribbon Pink (`#EC4899`) with Sylveon's distinctive **Pastel Sky Blue** (`#38BDF8`).
                - **⚡ Team Instinct (Dark & Light)**: Zapdos Lightning Gold paired with Storm Sky Cyan (`#38BDF8`) & Electric Cobalt (`#0284C7`).
                - **❄️ Team Mystic (Dark & Light)**: Articuno Ice Blue paired with Aurora Borealis Violet (`#C084FC`) & Royal Frost Indigo (`#7C3AED`).
                - **🔥 Team Valor (Dark & Light)**: Moltres Crimson paired with Molten Solar Gold (`#FBBF24`) & Phoenix Amber (`#D97706`).
                - **🛡️ SilphScope Slate (Default Generic)**: Placed last in the theme selector as a generic fallback theme.
            - **Complete Button, Team Edit & Replay Overlay Matrix Theming**:
              - Themed all previously unthemed buttons across **Battle Log** (`+ Log`, `☁️ Sync`, `🗑️ Trash`, `Clear`, `📋 Copy GBL`, `📤 Share`), **Settings** (`💾 Save Thresholds`, `↺ Restore Defaults`, all 3 cloud sync buttons, `Sync PvPoke`, `🔄 Reparse All`), and **Top Bar / Overlay** (`Start Battle Overlay`, `⚔️ Start Battle`).
              - Themed the **Team Edit** & **Manual Battle Log** dialogs and the **Interactive Replay Overlay Matrix** with active theme backgrounds, dual-accent headers, and centered background emblem watermarks.
            - **Enhanced Transparency Across All 3 Main Pages (`Teams`, `Battle Log`, `Settings`)**:
              - Increased watermark visibility and card transparency across all 3 main pages when watermarks are enabled so the background emblem clearly shines through.

            ### Shield & Theme Highlights Since v3.00 (`v3.02` – `v3.05`)
            - **v3.05 — Interactive Overlay Header Shield Counters (`🛡️ You` & `🛡️ Opp`)**:
              - Tap either shield icon in the floating overlay header to cycle remaining shields (`2 → 1 → 0 → 2`) mid-battle, log `SHIELD` timeline events, and immediately recalculate the 3x3 PvPoke matchup matrix and threat thresholds.
            - **v3.02–v3.03 — Dynamic Overlay Emblem Icons & Background Crest Watermarks**:
              - Theme-matched vector SVG emblems on the overlay minimize button, floating bubble, and `Start Battle` button, plus centered background crest watermarks and top-grouped Theme/Size/Transparency settings.
            
            ### Download & Install
            Download **`silphscope-pvp-${{ steps.version.outputs.tag }}.apk`** from the **Assets** section below and install on your Android device.
          files: |
            app/build/outputs/apk/release/named/silphscope-pvp-${{ steps.version.outputs.tag }}.apk
          draft: false
          prerelease: false
          make_latest: "true"
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

