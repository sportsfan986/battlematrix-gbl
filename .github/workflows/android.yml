name: Build Android APK

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Build Target'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
          - both

      workflow_version:
        description: 'Optional release version override (e.g. v1.01)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Release Version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.workflow_version }}" ]; then
            RAW_VER="${{ github.event.inputs.workflow_version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RAW_VER="${{ github.ref_name }}"
          elif [ -f VERSION ]; then
            RAW_VER=$(cat VERSION | tr -d '[:space:]')
          else
            RAW_VER="v1.00"
          fi
          CLEAN_NUM="${RAW_VER#v}"
          TAG_NAME="v${CLEAN_NUM}"
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "version_num=${CLEAN_NUM}" >> $GITHUB_OUTPUT
          echo "Resolved release version: ${TAG_NAME}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: |
          chmod +x gradlew

      - name: Verify or Generate Release Keystore
        run: |
          if [ ! -f app/release.keystore ]; then
            echo "Generating release keystore via keytool..."
            keytool -genkeypair -v \
              -keystore app/release.keystore \
              -alias gblkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass gblrelease123 \
              -keypass gblrelease123 \
              -dname "CN=SilphScope PvP, OU=Android, O=SilphScope, C=US"
          else
            echo "Release keystore is present at app/release.keystore"
          fi

      - name: Build Release APK
        if: github.event.inputs.build_target == 'release' || github.event.inputs.build_target == 'both' || github.event.inputs.build_target == '' || github.event_name == 'push'
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare Named Release APK for Public Download
        if: github.event.inputs.build_target == 'release' || github.event.inputs.build_target == 'both' || github.event.inputs.build_target == '' || github.event_name == 'push'
        run: |
          mkdir -p app/build/outputs/apk/release/named
          cp app/build/outputs/apk/release/*.apk "app/build/outputs/apk/release/named/silphscope-pvp-${{ steps.version.outputs.tag }}.apk"

      - name: Build Debug APK
        if: github.event.inputs.build_target == 'debug' || github.event.inputs.build_target == 'both'
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: silphscope-pvp-release-apk
          path: app/build/outputs/apk/release/named/silphscope-pvp-*.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: silphscope-pvp-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish Official GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "SilphScope PvP ${{ steps.version.outputs.tag }}"
          body: |
            ## SilphScope PvP ${{ steps.version.outputs.tag }} — Official v3.01 Release (Consolidating All v2.9x & v3.00 Milestones + Further Documentation Enhancements)
            
            ### Highlights in v3.00 / v3.01 & All 2.9x Releases (`v2.90` – `v3.01`)
            - **Phase 1 (v2.90) — Asymmetric 9-Shield Matrix & Blind Matchup Favorability (BMF)**:
              - Evaluates all 9 discrete shield permutations (`0v0`, `0v1`, `0v2`, `1v0`, `1v1`, `1v2`, `2v0`, `2v1`, `2v2`) for any head-to-head matchup.
              - Computes Pre-Match Blind Matchup Favorability ($M = 0.40 \cdot S_{\text{lead}} + 0.60 \cdot S_{\text{back}}$, $P_{\text{pre}}$) with automatic handling of early forfeits ($w = 0.00$ dropped when $<2$ opponents seen) and unrevealed 3rd closers ($w = 0.75$ Meta-Average 1v1 Prior `⚡ 75% Conf`).
            - **Phase 2 (v2.91) — Battle Timeline Tracking & Dynamic Execution WAE Engine**:
              - Records timestamped `SWAP`, `SHIELD`, and `FAINT` timeline events during live overlay battles.
              - Partitions battles into head-to-head intervals weighted by fractional duration ($S_{\text{actual}} = \sum \tau_k \cdot R_k$), applies **Faint Margin Scaling** ($\times 1.10$ on wins with $\ge 2$ faint margin), and applies **Shield-in-Pocket Penalties** ($-0.15 \times \text{userShieldsRemaining}$ on losses).
            - **Phase 3 (v2.93) — 5-Stat Analytics Dashboard, Performance Badges, Event Pills & Historical Migration**:
              - Upgraded the Battle Log summary to a 5-stat grid (`RECORD`, `LEAD MATCHUPS`, `WIN RATE`, `EXEC WAE`, `MATCHUP LUCK`).
              - Added the **6 Primary Performance Badges** (`Clutch Win`, `Skill Win`, `Expected Win`, `Blunder Loss`, `Tough Loss`, `Expected Loss`) and **5 Contextual Event Pills** (`⚠️ Double Shield Pocket`, `⚠️ Shield in Pocket`, `🧹 Clean Sweep`, `🛡️ Shield Advantage`, `⚡ 75% Conf`), Interactive Battle Recap / Timeline Replay, and automatic retroactive migration of existing battle logs.
            - **v2.94–v2.96 — Faint Detection, Top Statusbar Toasts & Battle Recap Stability**:
              - Reliable opponent faint detection, preserved swap clock timers on faint swap-ins, dedicated toast alerts for shields and faint swaps rendered in the top statusbar/clock strip (away from charged move buttons), and crash-free Battle Recap replay dialogs.
            - **v2.97–v3.00 — Standardized Go Battle Log Export Formatting, Share Line Format & Tasker Automation Hooks**:
              - Standardized Pokémon names in **Copy GBL** and **Share / Copy Summary** outputs (`basename_form`, `_` for spaces/hyphens, trailing `S` for Shadows such as `ninetales_alolanS` and `laprasS`, and `_MEGA` / `_MEGA_X` / `_MEGA_Y` / `_PRIMAL` suffixes such as `charizard_MEGA_Y`) while keeping in-app display names unchanged.
              - Updated Share individual battle output rows to `W/L (L->F/N/U, M->F/N/U) opponent1 opponent2 opponent3`.
              - Added headless Tasker intent hooks (`com.gbl.overlay.ACTION_START_OVERLAY`, `com.gbl.overlay.ACTION_STOP_OVERLAY`, `com.gbl.overlay.ACTION_TOGGLE_OVERLAY`, and `com.gbl.overlay.ACTION_OPEN_BATTLE_LOG` / `BattleLogActivity`) to start/stop the overlay without switching apps or launch straight to the Battle Log page.
            - **Phase 4 (v3.00–v3.01) — In-App `Help & Metric Guide`, Overlay Quick-Help HUD Dialog, Dedicated `❓ Help` Page & Reordered 4-Tab Navigation**:
              - Added interactive `(i)` info buttons next to `EXEC WAE` and `MATCHUP LUCK` on both Android and Web to open the **Help & Metric Guide**, plus full mathematical documentation in `README.md`.
              - **v3.01 Further Documentation Enhancements for Users**:
                - Added an in-app **❓ Help** button right in the **Start Battle Overlay / Status: Idle** top bar that opens the **Overlay HUD & Battle Flow Guide** explaining the general battle flow, how to read 3x3 Charged Move Damage percentages (`C1% / C2%`), how to interpret the **Shield Matrix** (`0S • 1S • 2S` 5-tier dots and 9-state `0v0–2v2` engine), **Dual 50s Swap Clocks** with faint swap-in preservation, fast move counting, sneak prevention, CMP ties, and top statusbar toasts.
                - Reordered main navigation tabs to **⚔️ Teams • 📜 Battle Logs • ⚙️ Settings • ❓ Help** and added a comprehensive full-page **❓ Help** tab containing all instructions, tactical tips, and usage guides in one place.
            
            ### Download & Install
            Download **`silphscope-pvp-${{ steps.version.outputs.tag }}.apk`** from the **Assets** section below and install on your Android device.
          files: |
            app/build/outputs/apk/release/named/silphscope-pvp-${{ steps.version.outputs.tag }}.apk
          draft: false
          prerelease: false
          make_latest: "true"
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

