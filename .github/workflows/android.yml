name: Build Android APK

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Build Target'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
          - both

      workflow_version:
        description: 'Optional release version override (e.g. v1.01)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Release Version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.workflow_version }}" ]; then
            RAW_VER="${{ github.event.inputs.workflow_version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RAW_VER="${{ github.ref_name }}"
          elif [ -f VERSION ]; then
            RAW_VER=$(cat VERSION | tr -d '[:space:]')
          else
            RAW_VER="v1.00"
          fi
          CLEAN_NUM="${RAW_VER#v}"
          TAG_NAME="v${CLEAN_NUM}"
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "version_num=${CLEAN_NUM}" >> $GITHUB_OUTPUT
          echo "Resolved release version: ${TAG_NAME}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: |
          chmod +x gradlew

      - name: Verify or Generate Release Keystore
        run: |
          if [ ! -f app/release.keystore ]; then
            echo "Generating release keystore via keytool..."
            keytool -genkeypair -v \
              -keystore app/release.keystore \
              -alias gblkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass gblrelease123 \
              -keypass gblrelease123 \
              -dname "CN=SilphScope PvP, OU=Android, O=SilphScope, C=US"
          else
            echo "Release keystore is present at app/release.keystore"
          fi

      - name: Build Release APK
        if: github.event.inputs.build_target == 'release' || github.event.inputs.build_target == 'both' || github.event.inputs.build_target == '' || github.event_name == 'push'
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare Named Release APK for Public Download
        if: github.event.inputs.build_target == 'release' || github.event.inputs.build_target == 'both' || github.event.inputs.build_target == '' || github.event_name == 'push'
        run: |
          mkdir -p app/build/outputs/apk/release/named
          cp app/build/outputs/apk/release/*.apk "app/build/outputs/apk/release/named/silphscope-pvp-${{ steps.version.outputs.tag }}.apk"

      - name: Build Debug APK
        if: github.event.inputs.build_target == 'debug' || github.event.inputs.build_target == 'both'
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: silphscope-pvp-release-apk
          path: app/build/outputs/apk/release/named/silphscope-pvp-*.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: silphscope-pvp-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish Official GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "SilphScope PvP ${{ steps.version.outputs.tag }}"
          body: |
            ## SilphScope PvP ${{ steps.version.outputs.tag }} — Official v3.10 Release (ABB/ABC Auto-Detection, Position-Weighted Shield Ratings & Aggregate Team BR Engine)
            
            ### What's New in v3.10
            - **Auto Team Style Detection (`ABB` vs. `ABC`) & Safe Swap Slot Reordering**:
              - Added **⚡ Auto-Detect Style & Order Swap** in the Create/Edit Team modal and **⚡ Auto** on saved Team Preset cards, alongside manual `#1 ⇄ #2` and `#2 ⇄ #3` slot swap buttons.
              - Evaluates pairwise defensive type vulnerabilities across all 3 team members to classify teams as **ABB** (moving the resisting $A$ Pokémon to Slot 1 Lead, Bait $B_1$ to Slot 2 Safe Swap, and Sweeper $B_2$ to Slot 3 Closer) or **ABC** (keeping Slot 1 Lead fixed and promoting the bench Pokémon with the highest consistency-adjusted Safe Swap index $\mu_{BR} - 0.5\sigma_{BR}$ to Slot 2).
            - **Blended Current-Season Meta Distribution with Recency Decay**:
              - Binds historical battle logs strictly to the current GBL season (`currentSeasonId`), scaling history weight linearly from `0%` at `0` matches up to `70%` at `50+` matches (`30%` PvPoke meta baseline).
              - Weights more recent battle logs exponentially higher than older logs ($W_{\text{log}}(k) = e^{-0.05 \cdot (k - 1)}$), mirroring the PvPoke rank decay curve.
              - Uses Opponent Lead frequencies for **Lead Aggregate BR** and full 3-mon opponent team frequencies for **Machine Aggregate BR** and **Swap BR**.
            - **Position-Weighted Shield Scenario Battle Ratings**:
              - **Lead (`Slot 1`)**: $0.50 \cdot BR_{2v2} + 0.50 \cdot BR_{1v1}$
              - **Safe Swap / Pivot (`Slot 2`)**: $0.60 \cdot BR_{1v1} + 0.25 \cdot BR_{2v1} + 0.15 \cdot BR_{1v0}$
              - **Closer / Sweeper (`Slot 3`)**: $0.60 \cdot BR_{0v0} + 0.25 \cdot BR_{1v0} + 0.15 \cdot BR_{0v1}$
            - **Color-Coded Lead BR, Per-Slot Swap BR & Configurable Machine BR Thresholds**:
              - Displays `[ABB]` / `[ABC]` archetype pills, **Lead BR** (`SW/W/N/L/SL` color-coded), **Machine BR** (`Elite / Strong / Viable / Shaky / Corebreaker` with customizable thresholds in Settings), and individual **Swap BR** badges on both Slot 2 (Safe Swap) and Slot 3 (Closer).
              - Automatically recalculates all saved team presets for the active league whenever the Battle Overlay is launched.
            
            ### Download & Install
            Download **`silphscope-pvp-${{ steps.version.outputs.tag }}.apk`** from the **Assets** section below and install on your Android device.
          files: |
            app/build/outputs/apk/release/named/silphscope-pvp-${{ steps.version.outputs.tag }}.apk
          draft: false
          prerelease: false
          make_latest: "true"
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

