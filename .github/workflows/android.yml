name: Build Android APK

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Build Target'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
          - both

      workflow_version:
        description: 'Optional release version override (e.g. v1.01)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Release Version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.workflow_version }}" ]; then
            RAW_VER="${{ github.event.inputs.workflow_version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RAW_VER="${{ github.ref_name }}"
          elif [ -f VERSION ]; then
            RAW_VER=$(cat VERSION | tr -d '[:space:]')
          else
            RAW_VER="v1.00"
          fi
          CLEAN_NUM="${RAW_VER#v}"
          TAG_NAME="v${CLEAN_NUM}"
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "version_num=${CLEAN_NUM}" >> $GITHUB_OUTPUT
          echo "Resolved release version: ${TAG_NAME}"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: |
          chmod +x gradlew

      - name: Verify or Generate Release Keystore
        run: |
          if [ ! -f app/release.keystore ]; then
            echo "Generating release keystore via keytool..."
            keytool -genkeypair -v \
              -keystore app/release.keystore \
              -alias gblkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass gblrelease123 \
              -keypass gblrelease123 \
              -dname "CN=SilphScope PvP, OU=Android, O=SilphScope, C=US"
          else
            echo "Release keystore is present at app/release.keystore"
          fi

      - name: Build Release APK
        if: github.event.inputs.build_target == 'release' || github.event.inputs.build_target == 'both' || github.event.inputs.build_target == '' || github.event_name == 'push'
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare Named Release APK for Public Download
        if: github.event.inputs.build_target == 'release' || github.event.inputs.build_target == 'both' || github.event.inputs.build_target == '' || github.event_name == 'push'
        run: |
          mkdir -p app/build/outputs/apk/release/named
          cp app/build/outputs/apk/release/*.apk "app/build/outputs/apk/release/named/silphscope-pvp-${{ steps.version.outputs.tag }}.apk"

      - name: Build Debug APK
        if: github.event.inputs.build_target == 'debug' || github.event.inputs.build_target == 'both'
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: silphscope-pvp-release-apk
          path: app/build/outputs/apk/release/named/silphscope-pvp-*.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: always() && (github.event.inputs.build_target == 'debug' || github.event.inputs.build_target == 'both')
        with:
          name: silphscope-pvp-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish Official GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "SilphScope PvP ${{ steps.version.outputs.tag }}"
          body: |
            ## SilphScope PvP ${{ steps.version.outputs.tag }} — Official v3.34 Release (Post-Faint Switch Recommendations, Counter-Swap Minimax, Midpoint Swap Clock & AI Training Export)
            
            ### What's New in v3.34
            - **Post-Faint `"Switch in a new Pokémon?"` Modal Detection & Replacement Scorer**:
              - Expanded bottom OCR vertical capture (`srcMoves`: `0.70f..0.95f`) to detect `"Switch in a new Pokémon?"` / `"Choose a Pokémon"` after your Pokémon faints.
              - Scores your remaining alive bench Pokémon across **Active Opponent Matchup (45%)**, **Both Teams' Swap Clocks (25%)**, **Known Bench Opponent Matchup (20%)**, and **Expected Unseen Meta Threats (10%)**, with a 1-tap **"Send In ➔"** confirmation button in the HUD.
            - **Counter-Swap Minimax & Faint vs. Manual Swap Clock Differentiation**:
              - Differentiates post-faint entries (which do **not** reset the 50s swap clock) from manual switches (50s swap clock reset).
              - Evaluates both `playerSwapRemainingSec` and `oppSwapRemainingSec` before recommending swaps: penalizes aggressive alignment swaps when the opponent's swap clock is unlocked (`0s`) and recommends **Stay In & Chip / Soft Lose** or **Safe Swap**, while recommending **Punish Locked Switch** when the opponent is swap-locked (`> 15s`).
            - **Full Shield & Fainted Pokémon Picture for Endgame / Backline Advice**:
              - Replaces front-line alignment advice (`"Maintain Alignment"`) once Pokémon have fainted with dedicated **1v1 Closer**, **2v1 Advantage**, and **1v2 Comeback** recommendations factoring in `playerAliveCount`, `oppAliveCount`, `playerShieldsRemaining`, and `oppShieldsRemaining`.
            - **1st-Frame Immediate Swap Detection, Midpoint Swap Clock & 2nd-Frame Validity Bit Latch**:
              - Updates the HUD, active matchup column, and tactical recommendations immediately on **Frame 1** (`[1F]` provisional badge on the swap clock) while anchoring the swap clock start time **halfway between the last frame with the old Pokémon and the first frame with the new Pokémon**.
              - Latches on **Frame 2** when confirmed by successive OCR, or automatically reverts the swap clock if Frame 2 fails to confirm or a Pokéball faint drop confirms a post-faint entry.
            - **Decision-Tree AI Training Telemetry & Detailed JSONL Log Export**:
              - Tracks recommended actions, candidate scores, swap clocks, shield/alive states, actual player/opponent actions, and recommendation adherence (`adherenceRatePct`) across battle timelines, with **🤖 AI Training Detailed Log (JSONL Dataset)** export in both Android and Web.
            
            ### Live Web Simulator & Download
            - **Live Web Simulator**: [https://sportsfan986.github.io/silphscope-pvp/](https://sportsfan986.github.io/silphscope-pvp/)
            - **Android APK**: Download **`silphscope-pvp-${{ steps.version.outputs.tag }}.apk`** from the **Assets** section below and install on your Android device.
          files: |
            app/build/outputs/apk/release/named/silphscope-pvp-${{ steps.version.outputs.tag }}.apk
          draft: false
          prerelease: false
          make_latest: "true"
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

