name: Build Android APK

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Build Target'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
          - both

      workflow_version:
        description: 'Optional release version override (e.g. v1.01)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Release Version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.workflow_version }}" ]; then
            RAW_VER="${{ github.event.inputs.workflow_version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RAW_VER="${{ github.ref_name }}"
          elif [ -f VERSION ]; then
            RAW_VER=$(cat VERSION | tr -d '[:space:]')
          else
            RAW_VER="v1.00"
          fi
          CLEAN_NUM="${RAW_VER#v}"
          TAG_NAME="v${CLEAN_NUM}"
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "version_num=${CLEAN_NUM}" >> $GITHUB_OUTPUT
          echo "Resolved release version: ${TAG_NAME}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: |
          chmod +x gradlew

      - name: Verify or Generate Release Keystore
        run: |
          if [ ! -f app/release.keystore ]; then
            echo "Generating release keystore via keytool..."
            keytool -genkeypair -v \
              -keystore app/release.keystore \
              -alias gblkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass gblrelease123 \
              -keypass gblrelease123 \
              -dname "CN=SilphScope PvP, OU=Android, O=SilphScope, C=US"
          else
            echo "Release keystore is present at app/release.keystore"
          fi

      - name: Build Release APK
        if: github.event.inputs.build_target == 'release' || github.event.inputs.build_target == 'both' || github.event.inputs.build_target == '' || github.event_name == 'push'
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare Named Release APK for Public Download
        if: github.event.inputs.build_target == 'release' || github.event.inputs.build_target == 'both' || github.event.inputs.build_target == '' || github.event_name == 'push'
        run: |
          mkdir -p app/build/outputs/apk/release/named
          cp app/build/outputs/apk/release/*.apk "app/build/outputs/apk/release/named/silphscope-pvp-${{ steps.version.outputs.tag }}.apk"

      - name: Build Debug APK
        if: github.event.inputs.build_target == 'debug' || github.event.inputs.build_target == 'both'
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: silphscope-pvp-release-apk
          path: app/build/outputs/apk/release/named/silphscope-pvp-*.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: silphscope-pvp-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish Official GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "SilphScope PvP ${{ steps.version.outputs.tag }}"
          body: |
            ## SilphScope PvP ${{ steps.version.outputs.tag }} — Official v3.03 Release (Complete UI Theme Coverage & Dynamic Theme Emblem Icons on Floating Overlay)
            
            ### What's New in v3.03 (Complete UI Theme Coverage & Floating Overlay Emblem Icons)
            - **Replaced Battle Icon (`⚔️`) with Active Theme Emblem Icon on Overlay (`overlay.html`, `src/App.tsx`)**: The upper-left overlay minimize button (`#btn-minimize-sword`), floating minimized bubble (`#minimized-bubble`), and `Start Battle` button now dynamically display a crisp custom SVG emblem matching your active theme (Zapdos Lightning crest for Instinct, Articuno Ice crest for Mystic, Moltres Flame crest for Valor, Sylveon Fairy Bow for Sylveon, Matrix Phosphor Terminal symbol for AMOLED Matrix, Cyber Cyan Hexagon for AMOLED Cyan, and SilphScope Reticle for Slate).
            - **Fixed All Remaining Unthemed Blue Elements Across App & Overlay (`MainActivity.kt`, `overlay.html`, `OverlayService.kt`, `src/App.tsx`)**:
              - Extended recursive Android view theming to cover all `Button`s (`Start Battle Overlay`, `+ New Team`, `My Fasts`, `3 Moves`, `Toasts On`, `Save 5-Tier Thresholds`, `Sync Now`, `Reparse`, `Download PvPoke`, `Copy/Share`), `ImageButton`s (`Edit Team`), `Switch`es, `RadioButton`s / `CheckBox`es (`item_team_preset`), `Spinner` dropdown menus, top header logo badge, Battle Log empty state cards, and all modal dialogs (Preset Editor, Battle Log Replay WebView, GitHub Sync, and Trash Bins).
              - Replaced hardcoded sky-blue (`#38bdf8`) borders and glows on the floating overlay's active Pokémon row, active opponent column, Form button, and Start Battle menu with dynamic `var(--header-accent-rgb)` and `var(--panel-border-rgb)` theme variables while preserving 100% of tactical combat colors (5-tier matchup dots, 9-state shield matrix tags, move-type dots, `KO!` badges, and 50s swap timers).
            
            ### Included from v3.02 (10-Theme Engine & Pokémon GO Team / Sylveon Watermarks)
            - **10 Distinct Themes (`MainActivity.kt`, `OverlayService.kt`, `overlay.html`, `activity_main.xml`, `src/App.tsx`)**:
              1. **SilphScope Slate (Default Dark)** — Deep tactical navy (`#080C14`) with Sky Cyan (`#38BDF8`) and Amber (`#F59E0B`) accents.
              2. **AMOLED Cyber Cyan** — True `#000000` black canvas with Electric Cyan (`#00F0FF`) accents for zero OLED pixel draw.
              3. **AMOLED Matrix Phosphor** — True `#000000` black canvas with terminal phosphor Matrix Lime (`#00FF41`) accents.
              4. **Team Instinct Dark (Storm Gold)** & **5. Team Instinct Light (Spark Daylight)** — Thunder charcoal / warm ivory palettes with Zapdos Lightning Gold (`#FACC15` / `#CA8A04`) and custom centered Zapdos electric diamond vector watermark (`bg_emblem_instinct.xml`).
              6. **Team Mystic Dark (Blizzard Navy)** & **7. Team Mystic Light (Glacier Frost)** — Deep glacial abyss / crisp ice white palettes with Articuno Ice Blue (`#38BDF8` / `#0284C7`) and custom centered Articuno hexagonal ice crest vector watermark (`bg_emblem_mystic.xml`).
              7. **Team Valor Dark (Magma Crimson)** & **8. Team Valor Light (Phoenix Sun)** — Smoldering obsidian / warm blush white palettes with Moltres Flame Red (`#F87171` / `#DC2626`) and custom centered Moltres fiery phoenix crest vector watermark (`bg_emblem_valor.xml`).
              8. **Sylveon Fairy Ribbon (Light)** — Soft pastel cream-blush (`#FFF5F8`) with Sylveon ribbon pink (`#EC4899`) + nymph sky-blue (`#38BDF8`) accents and custom Sylveon bow, feeler ribbons, and fairy sparkles watermark (`bg_emblem_sylveon.xml`).
            - **Settings Page Reorganization**: Grouped **App & Overlay Theme, Size & Transparency** together in Card 1 at the very top of Settings.

            ### Highlights in v3.00 / v3.01 & All 2.9x Releases (`v2.90` – `v3.01`)
            - **Phase 1 (v2.90) — Asymmetric 9-Shield Matrix & Blind Matchup Favorability (BMF)**:
              - Evaluates all 9 discrete shield permutations (`0v0`, `0v1`, `0v2`, `1v0`, `1v1`, `1v2`, `2v0`, `2v1`, `2v2`) for any head-to-head matchup.
              - Computes Pre-Match Blind Matchup Favorability ($M = 0.40 \cdot S_{\text{lead}} + 0.60 \cdot S_{\text{back}}$, $P_{\text{pre}}$) with automatic handling of early forfeits ($w = 0.00$ dropped when $<2$ opponents seen) and unrevealed 3rd closers ($w = 0.75$ Meta-Average 1v1 Prior `⚡ 75% Conf`).
            - **Phase 2 (v2.91) — Battle Timeline Tracking & Dynamic Execution WAE Engine**:
              - Records timestamped `SWAP`, `SHIELD`, and `FAINT` timeline events during live overlay battles.
              - Partitions battles into head-to-head intervals weighted by fractional duration ($S_{\text{actual}} = \sum \tau_k \cdot R_k$), applies **Faint Margin Scaling** ($\times 1.10$ on wins with $\ge 2$ faint margin), and applies **Shield-in-Pocket Penalties** ($-0.15 \times \text{userShieldsRemaining}$ on losses).
            - **Phase 3 (v2.93) — 5-Stat Analytics Dashboard, Performance Badges, Event Pills & Historical Migration**:
              - Upgraded the Battle Log summary to a 5-stat grid (`RECORD`, `LEAD MATCHUPS`, `WIN RATE`, `EXEC WAE`, `MATCHUP LUCK`).
              - Added the **6 Primary Performance Badges** (`Clutch Win`, `Skill Win`, `Expected Win`, `Blunder Loss`, `Tough Loss`, `Expected Loss`) and **5 Contextual Event Pills** (`⚠️ Double Shield Pocket`, `⚠️ Shield in Pocket`, `🧹 Clean Sweep`, `🛡️ Shield Advantage`, `⚡ 75% Conf`), Interactive Battle Recap / Timeline Replay, and automatic retroactive migration of existing battle logs.
            - **v2.94–v3.01 — Faint Detection, Top Statusbar Toasts, Standardized GBL Export, Tasker Hooks & In-App Help Guide**:
              - Reliable opponent faint detection, preserved swap clock timers on faint swap-ins, dedicated top statusbar toasts, standardized Go Battle Log export formatting, Share individual battle line format (`W/L (L->F/N/U, M->F/N/U) opponent1 opponent2 opponent3`), Tasker automation hooks, and dedicated in-app **❓ Help** page with 3-tab bottom/top navigation.
            
            ### Download & Install
            Download **`silphscope-pvp-${{ steps.version.outputs.tag }}.apk`** from the **Assets** section below and install on your Android device.
          files: |
            app/build/outputs/apk/release/named/silphscope-pvp-${{ steps.version.outputs.tag }}.apk
          draft: false
          prerelease: false
          make_latest: "true"
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

