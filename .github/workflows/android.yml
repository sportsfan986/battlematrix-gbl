name: Build Android APK

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Build Target'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
          - both

      workflow_version:
        description: 'Optional release version override (e.g. v1.01)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Release Version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.workflow_version }}" ]; then
            RAW_VER="${{ github.event.inputs.workflow_version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RAW_VER="${{ github.ref_name }}"
          elif [ -f VERSION ]; then
            RAW_VER=$(cat VERSION | tr -d '[:space:]')
          else
            RAW_VER="v1.00"
          fi
          CLEAN_NUM="${RAW_VER#v}"
          TAG_NAME="v${CLEAN_NUM}"
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "version_num=${CLEAN_NUM}" >> $GITHUB_OUTPUT
          echo "Resolved release version: ${TAG_NAME}"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: |
          chmod +x gradlew

      - name: Verify or Generate Release Keystore
        run: |
          if [ ! -f app/release.keystore ]; then
            echo "Generating release keystore via keytool..."
            keytool -genkeypair -v \
              -keystore app/release.keystore \
              -alias gblkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass gblrelease123 \
              -keypass gblrelease123 \
              -dname "CN=SilphScope PvP, OU=Android, O=SilphScope, C=US"
          else
            echo "Release keystore is present at app/release.keystore"
          fi

      - name: Build Release APK
        if: github.event.inputs.build_target == 'release' || github.event.inputs.build_target == 'both' || github.event.inputs.build_target == '' || github.event_name == 'push'
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare Named Release APK for Public Download
        if: github.event.inputs.build_target == 'release' || github.event.inputs.build_target == 'both' || github.event.inputs.build_target == '' || github.event_name == 'push'
        run: |
          mkdir -p app/build/outputs/apk/release/named
          cp app/build/outputs/apk/release/*.apk "app/build/outputs/apk/release/named/silphscope-pvp-${{ steps.version.outputs.tag }}.apk"

      - name: Build Debug APK
        if: github.event.inputs.build_target == 'debug' || github.event.inputs.build_target == 'both'
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: silphscope-pvp-release-apk
          path: app/build/outputs/apk/release/named/silphscope-pvp-*.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: always() && (github.event.inputs.build_target == 'debug' || github.event.inputs.build_target == 'both')
        with:
          name: silphscope-pvp-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish Official GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "SilphScope PvP ${{ steps.version.outputs.tag }}"
          body: |
            ## SilphScope PvP ${{ steps.version.outputs.tag }} — Official v3.32 Release (Dynamic Resizing & Intelligent 2-Line Wrapping for Battle Recommendations)
            
            ### What's New in v3.32
            - **Dynamic Resizing & Intelligent 2-Line Text Wrapping for Battle Recommendations (`overlay.html`, `OverlayService.kt`, `App.tsx`)**:
              - Upgraded the **Lead & Swap Tactical Recommendation Row** (`[Archetype] Action · [Shield Plan] · Goal`) to support **intelligent 2-line text wrapping** and **dynamic font/height resizing** instead of single-line ellipsis truncation.
              - Keeps `[Archetype] Action` and `[Shield Plan]` badges grouped together on Line 1 while allowing `Goal: ...` to either stay on Line 1 when short or wrap cleanly onto Line 2 in full without cropping (`Goal: Soft Lose 0S -> Farm Down`, etc.).
              - Automatically scales font size (`7.5px` down to `6.8px` for extra-long recommendations) and triggers immediate `WindowManager` height recalculation (`notifyHeight()` / `updateContentHeight`) so the floating overlay dynamically adjusts its height whenever the recommendation row wraps to two lines.
            - **Includes All v3.31 & v3.30 Upgrades**:
              - **Top-50 Meta Depth** for **Key Wins**, **Key Threats**, and **Core Breakers** in Team Builder & Team Editor.
              - **Streamlined Team Summary Cards** showing Pokémon names, IVs/CP, roles, Key Wins, Key Threats, and Core Breakers.
              - **Duo-Core (`DUO`)** team creation & auto-detection (`Best 5 ABB`, `Best 5 ABC`, `Best 5 Duo-Core`) and **2-Frame Continual Shield Monitoring & Restoration**.
            
            ### Live Web Simulator & Download
            - **Live Web Simulator**: [https://sportsfan986.github.io/silphscope-pvp/](https://sportsfan986.github.io/silphscope-pvp/)
            - **Android APK**: Download **`silphscope-pvp-${{ steps.version.outputs.tag }}.apk`** from the **Assets** section below and install on your Android device.
          files: |
            app/build/outputs/apk/release/named/silphscope-pvp-${{ steps.version.outputs.tag }}.apk
          draft: false
          prerelease: false
          make_latest: "true"
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

