name: Build Android APK

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Build Target'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
          - both

      workflow_version:
        description: 'Optional release version override (e.g. v1.01)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Release Version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.workflow_version }}" ]; then
            RAW_VER="${{ github.event.inputs.workflow_version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RAW_VER="${{ github.ref_name }}"
          elif [ -f VERSION ]; then
            RAW_VER=$(cat VERSION | tr -d '[:space:]')
          else
            RAW_VER="v1.00"
          fi
          CLEAN_NUM="${RAW_VER#v}"
          TAG_NAME="v${CLEAN_NUM}"
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "version_num=${CLEAN_NUM}" >> $GITHUB_OUTPUT
          echo "Resolved release version: ${TAG_NAME}"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: |
          chmod +x gradlew

      - name: Verify or Generate Release Keystore
        run: |
          if [ ! -f app/release.keystore ]; then
            echo "Generating release keystore via keytool..."
            keytool -genkeypair -v \
              -keystore app/release.keystore \
              -alias gblkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass gblrelease123 \
              -keypass gblrelease123 \
              -dname "CN=SilphScope PvP, OU=Android, O=SilphScope, C=US"
          else
            echo "Release keystore is present at app/release.keystore"
          fi

      - name: Build Release APK
        if: github.event.inputs.build_target == 'release' || github.event.inputs.build_target == 'both' || github.event.inputs.build_target == '' || github.event_name == 'push'
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare Named Release APK for Public Download
        if: github.event.inputs.build_target == 'release' || github.event.inputs.build_target == 'both' || github.event.inputs.build_target == '' || github.event_name == 'push'
        run: |
          mkdir -p app/build/outputs/apk/release/named
          cp app/build/outputs/apk/release/*.apk "app/build/outputs/apk/release/named/silphscope-pvp-${{ steps.version.outputs.tag }}.apk"

      - name: Build Debug APK
        if: github.event.inputs.build_target == 'debug' || github.event.inputs.build_target == 'both'
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: silphscope-pvp-release-apk
          path: app/build/outputs/apk/release/named/silphscope-pvp-*.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: always() && (github.event.inputs.build_target == 'debug' || github.event.inputs.build_target == 'both')
        with:
          name: silphscope-pvp-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish Official GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "SilphScope PvP ${{ steps.version.outputs.tag }}"
          body: |
            ## SilphScope PvP ${{ steps.version.outputs.tag }} — Official v3.30 Release (Duo-Core Team Builder & Auto-Detection, Lead & Swap Tactical Recommendations Module, and 2-Frame Shield Restoration Fix)
            
            ### What's New in v3.30
            - **Duo-Core (`DUO`) Team Creation, Auto-Detection & Competitive Playbooks (`OverlayService.kt`, `gblData.ts`, `MainActivity.kt`, `App.tsx`)**:
              - **Duo-Core Archetype**: Recreates the symmetric Yin & Yang synergy of classic duo-cores (like Swampert/Skarmory or Clodsire/Feraligatr) where the **1st (`[Core 1] Lead`)** and **3rd (`[Core 2] Co-Core`)** Pokémon cover each other's weaknesses reciprocally (allowing you to swap 1st and 3rd with 1 tap to adapt to micro-meta shifts), while the **2nd (`[Pivot] Safe Swap`)** absorbs pressure, burns opponent shields, or fights for switch/shield advantage so Slot 1 or 3 can farm down for energy.
              - **Anti-Meta Team Builder**: Now generates and displays **Best 5 ABB**, **Best 5 ABC**, and **Best 5 Duo-Core** sections, plus competitive strategy playbooks for **Duo-Core**, **ABC**, and **ABB** teams.
              - **Team Viewer & Editor**: Added `DUO` style mode (`AUTO | ABB | ABC | DUO`) and 1-tap `☯️ 1 ⇄ 3` Core Swap button.
            - **Lead & Swap Tactical Recommendations Module (`OverlayService.kt`, `overlay.html`, `gblData.ts`, `MainActivity.kt`, `App.tsx`)**:
              - Added an **ultra-compact 1-line tactical recommendation badge** in the overlay between the **Header Row** and **Start/Stop Battle Row** showing **Action**, **Shield Plan (`0S` / `1S` / `2S`)**, and **Matchup Goal** based on your active Pokémon, opponent Pokémon, predetermined 9x9 shield matrix data, and team style (`ABB`, `ABC`, `DUO`).
              - Recommends whether to **Stay In**, **Swap / Pivot** (and who to swap to), **Counter-Swap** when the opponent swaps, and the specific **Goal of the Matchup** (*Hold Switch Adv*, *Win +1 Shield & Let Go*, *Soft Lose -> Farm w/ [Mon]*, *Eliminate Backline Threat*).
              - Enabled by default with a toggle in the **Settings** tab (`Recs On` / `Recs Off`).
            - **Continual Shield Monitoring & 2-Frame Shield Restoration Fix (`OverlayService.kt`)**:
              - Continually monitors player and opponent shield counts during battle; if for **2 consecutive steady HUD frames** a shield was not used (`sampledShields > shieldsRemaining`), automatically restores the shield to the shield counter and removes the false `SHIELD` timeline event.
            
            ### Live Web Simulator & Download
            - **Live Web Simulator**: [https://sportsfan986.github.io/silphscope-pvp/](https://sportsfan986.github.io/silphscope-pvp/)
            - **Android APK**: Download **`silphscope-pvp-${{ steps.version.outputs.tag }}.apk`** from the **Assets** section below and install on your Android device.
          files: |
            app/build/outputs/apk/release/named/silphscope-pvp-${{ steps.version.outputs.tag }}.apk
          draft: false
          prerelease: false
          make_latest: "true"
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

