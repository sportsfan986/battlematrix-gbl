name: Build Android APK

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Build Target'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
          - both

      workflow_version:
        description: 'Optional release version override (e.g. v1.01)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Release Version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.workflow_version }}" ]; then
            RAW_VER="${{ github.event.inputs.workflow_version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RAW_VER="${{ github.ref_name }}"
          elif [ -f VERSION ]; then
            RAW_VER=$(cat VERSION | tr -d '[:space:]')
          else
            RAW_VER="v1.00"
          fi
          CLEAN_NUM="${RAW_VER#v}"
          TAG_NAME="v${CLEAN_NUM}"
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "version_num=${CLEAN_NUM}" >> $GITHUB_OUTPUT
          echo "Resolved release version: ${TAG_NAME}"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: |
          chmod +x gradlew

      - name: Verify or Generate Release Keystore
        run: |
          if [ ! -f app/release.keystore ]; then
            echo "Generating release keystore via keytool..."
            keytool -genkeypair -v \
              -keystore app/release.keystore \
              -alias gblkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass gblrelease123 \
              -keypass gblrelease123 \
              -dname "CN=SilphScope PvP, OU=Android, O=SilphScope, C=US"
          else
            echo "Release keystore is present at app/release.keystore"
          fi

      - name: Build Release APK
        if: github.event.inputs.build_target == 'release' || github.event.inputs.build_target == 'both' || github.event.inputs.build_target == '' || github.event_name == 'push'
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare Named Release APK for Public Download
        if: github.event.inputs.build_target == 'release' || github.event.inputs.build_target == 'both' || github.event.inputs.build_target == '' || github.event_name == 'push'
        run: |
          mkdir -p app/build/outputs/apk/release/named
          cp app/build/outputs/apk/release/*.apk "app/build/outputs/apk/release/named/silphscope-pvp-${{ steps.version.outputs.tag }}.apk"

      - name: Build Debug APK
        if: github.event.inputs.build_target == 'debug' || github.event.inputs.build_target == 'both'
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: silphscope-pvp-release-apk
          path: app/build/outputs/apk/release/named/silphscope-pvp-*.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: always() && (github.event.inputs.build_target == 'debug' || github.event.inputs.build_target == 'both')
        with:
          name: silphscope-pvp-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish Official GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "SilphScope PvP ${{ steps.version.outputs.tag }}"
          body: |
            ## SilphScope PvP ${{ steps.version.outputs.tag }} — Official v3.22 Release (Top-100 Role-Weighted Anti-Meta Team Builder, 3-Slot Alternate Moveset Simulation, Key Threats / Core Breakers & Top-25 SilphScope Meta Audit)
            
            ### What's New in v3.22
            - **Top-100 Flattened Role-Weighted Synthetic Meta Blended with Season Logs (`OverlayService.kt` & `gblData.ts`)**:
              - Upgraded the Anti-Meta Team Builder (`ABB` / `ABC`) to build and score all candidate lineups (`Core BR`, `Lead BR`, `Swap BR`, `Closer BR`) against a **Top-100 flattened synthetic meta** ($\exp(-0.022 \cdot i)$) weighted heaviest on the most common Pokémon for each role (`Lead`, `Safe Swap`, `Closer`) and blended with your current-season battle logs.
              - Expanded the candidate team generation pool to the **Top 60+ Meta Pokémon** per league while enforcing GBL species-clause and Mega Master League constraints.
            - **`Beats X/25 Top Meta` Depth & Bottom Top 25 SilphScope Meta Reference List (`MainActivity.kt` & `App.tsx`)**:
              - Increased the Top Meta target audit depth displayed on each generated ABB and ABC team card from `/15` to **`/25` (`Beats X/25 Top Meta`)**.
              - Added a **"🎯 Top 25 <League> Meta Determined by SilphScope (Target Audit Pool for /25 Wins)"** card at the bottom of the Anti-Meta Team Builder panel listing `#1` through `#25` with species name and field weight percentage (`%`).
            - **3-Slot Alternate Moveset Simulation & `⚡ Alt Moveset` Highlighting**:
              - Simulates legal Fast + Charged move combinations across all 3 team members on top ABB and ABC candidate lineups against the Top-100 role-weighted meta.
              - Highlights any non-standard moveset on generated team cards with an **`⚡ Alt Moveset (+X BR)`** badge and move names (`Fast + Charged 1 / Charged 2`), carrying those optimized moves directly into the Edit Team screen on selection.
            - **Key Wins, Key Threats & Core Breakers Breakdown**:
              - Every generated ABB and ABC team card now displays **`✅ Key Wins`**, **`⚠️ Key Threats`** (Top-25 Pokémon that beat your Lead and pressure your backline), and **`🚨 Core Breakers`** (Top-25 Pokémon that beat all 3 team members `BR < 490`) in both the visual breakdown and the team synergy summary.
            
            ### Live Web Simulator & Download
            - **Live Web Simulator**: [https://sportsfan986.github.io/silphscope-pvp/](https://sportsfan986.github.io/silphscope-pvp/)
            - **Android APK**: Download **`silphscope-pvp-${{ steps.version.outputs.tag }}.apk`** from the **Assets** section below and install on your Android device.
          files: |
            app/build/outputs/apk/release/named/silphscope-pvp-${{ steps.version.outputs.tag }}.apk
          draft: false
          prerelease: false
          make_latest: "true"
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

