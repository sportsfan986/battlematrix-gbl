name: Build Android APK

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Build Target'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
          - both

      workflow_version:
        description: 'Optional release version override (e.g. v1.01)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Release Version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.workflow_version }}" ]; then
            RAW_VER="${{ github.event.inputs.workflow_version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RAW_VER="${{ github.ref_name }}"
          elif [ -f VERSION ]; then
            RAW_VER=$(cat VERSION | tr -d '[:space:]')
          else
            RAW_VER="v1.00"
          fi
          CLEAN_NUM="${RAW_VER#v}"
          TAG_NAME="v${CLEAN_NUM}"
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "version_num=${CLEAN_NUM}" >> $GITHUB_OUTPUT
          echo "Resolved release version: ${TAG_NAME}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: |
          chmod +x gradlew

      - name: Verify or Generate Release Keystore
        run: |
          if [ ! -f app/release.keystore ]; then
            echo "Generating release keystore via keytool..."
            keytool -genkeypair -v \
              -keystore app/release.keystore \
              -alias gblkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass gblrelease123 \
              -keypass gblrelease123 \
              -dname "CN=SilphScope PvP, OU=Android, O=SilphScope, C=US"
          else
            echo "Release keystore is present at app/release.keystore"
          fi

      - name: Build Release APK
        if: github.event.inputs.build_target == 'release' || github.event.inputs.build_target == 'both' || github.event.inputs.build_target == '' || github.event_name == 'push'
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare Named Release APK for Public Download
        if: github.event.inputs.build_target == 'release' || github.event.inputs.build_target == 'both' || github.event.inputs.build_target == '' || github.event_name == 'push'
        run: |
          mkdir -p app/build/outputs/apk/release/named
          cp app/build/outputs/apk/release/*.apk "app/build/outputs/apk/release/named/silphscope-pvp-${{ steps.version.outputs.tag }}.apk"

      - name: Build Debug APK
        if: github.event.inputs.build_target == 'debug' || github.event.inputs.build_target == 'both'
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: silphscope-pvp-release-apk
          path: app/build/outputs/apk/release/named/silphscope-pvp-*.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: silphscope-pvp-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish Official GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "SilphScope PvP ${{ steps.version.outputs.tag }}"
          body: |
            ## SilphScope PvP ${{ steps.version.outputs.tag }} — Official v3.05 Release (Interactive Overlay Header Shield Counters & Live Matrix Recalculation)
            
            ### What's New in v3.05 (Interactive Shield Counters & Mid-Match Rating Recalculation)
            - **Interactive Header Shield Counters (`overlay.html`, `OverlayService.kt`, `src/App.tsx`)**:
              - Added tactile, color-coded shield counters for both sides directly into the overlay's top header row:
                - **Player Shields (`🛡️ 2`)**: Visualized in active theme accent color (`#38BDF8`, gold, ice blue, red, pink, or lime); tap cycles `2 -> 1 -> 0 -> 2`.
                - **Opponent Shields (`🛡️ 2`)**: Visualized in soft pink/rose (`#F472B6`); tap cycles `2 -> 1 -> 0 -> 2`.
                - **Zero-Shield State**: Automatically dims and displays strike-through when 0 shields remain.
                - **Live PvPoke Matrix Recalculation**: Tapping to adjust shields immediately recalculates the 9-scenario PvPoke rating and re-renders matchup dots and threat percentages in real-time.
                - **Native Android Bridge**: Two-way synchronization between web overlay and native Android service with toasts and timeline logging.
            
            ### Included from v3.03 & v3.02 (Themes, Emblem Watermarks & Overlay Icons)
            - **Dynamic Theme Emblem Icons on Floating Overlay (`overlay.html`, `src/App.tsx`)**: The upper-left minimize button, floating bubble, and Start Battle button display crisp vector SVG emblems matching the active theme (Zapdos diamond, Articuno crest, Moltres flame, Sylveon bow, Matrix phosphor reticle, Cyber Cyan hexagon, and SilphScope reticle).
            - **Complete UI Theme Coverage (`MainActivity.kt`, `overlay.html`, `OverlayService.kt`, `src/App.tsx`)**: All buttons, switches, checkboxes, spinners, cards, and modal dialogs inherit the active theme.
            - **10 Distinct Themes**: SilphScope Slate, AMOLED Cyber Cyan, AMOLED Matrix Phosphor, Team Instinct Dark & Light, Team Mystic Dark & Light, Team Valor Dark & Light, and Sylveon Fairy Ribbon.

            ### Highlights in v3.00 / v3.01 & All 2.9x Releases (`v2.90` – `v3.01`)
            - **Phase 1 (v2.90) — Asymmetric 9-Shield Matrix & Blind Matchup Favorability (BMF)**:
              - Evaluates all 9 discrete shield permutations (`0v0`, `0v1`, `0v2`, `1v0`, `1v1`, `1v2`, `2v0`, `2v1`, `2v2`) for any head-to-head matchup.
              - Computes Pre-Match Blind Matchup Favorability ($M = 0.40 \cdot S_{\text{lead}} + 0.60 \cdot S_{\text{back}}$, $P_{\text{pre}}$) with automatic handling of early forfeits ($w = 0.00$ dropped when $<2$ opponents seen) and unrevealed 3rd closers ($w = 0.75$ Meta-Average 1v1 Prior `⚡ 75% Conf`).
            - **Phase 2 (v2.91) — Battle Timeline Tracking & Dynamic Execution WAE Engine**:
              - Records timestamped `SWAP`, `SHIELD`, and `FAINT` timeline events during live overlay battles.
              - Partitions battles into head-to-head intervals weighted by fractional duration ($S_{\text{actual}} = \sum \tau_k \cdot R_k$), applies **Faint Margin Scaling** ($\times 1.10$ on wins with $\ge 2$ faint margin), and applies **Shield-in-Pocket Penalties** ($-0.15 \times \text{userShieldsRemaining}$ on losses).
            - **Phase 3 (v2.93) — 5-Stat Analytics Dashboard, Performance Badges, Event Pills & Historical Migration**:
              - Upgraded the Battle Log summary to a 5-stat grid (`RECORD`, `LEAD MATCHUPS`, `WIN RATE`, `EXEC WAE`, `MATCHUP LUCK`).
              - Added the **6 Primary Performance Badges** (`Clutch Win`, `Skill Win`, `Expected Win`, `Blunder Loss`, `Tough Loss`, `Expected Loss`) and **5 Contextual Event Pills** (`⚠️ Double Shield Pocket`, `⚠️ Shield in Pocket`, `🧹 Clean Sweep`, `🛡️ Shield Advantage`, `⚡ 75% Conf`), Interactive Battle Recap / Timeline Replay, and automatic retroactive migration of existing battle logs.
            - **v2.94–v3.01 — Faint Detection, Top Statusbar Toasts, Standardized GBL Export, Tasker Hooks & In-App Help Guide**:
              - Reliable opponent faint detection, preserved swap clock timers on faint swap-ins, dedicated top statusbar toasts, standardized Go Battle Log export formatting, Share individual battle line format (`W/L (L->F/N/U, M->F/N/U) opponent1 opponent2 opponent3`), Tasker automation hooks, and dedicated in-app **❓ Help** page with 3-tab bottom/top navigation.
            
            ### Download & Install
            Download **`silphscope-pvp-${{ steps.version.outputs.tag }}.apk`** from the **Assets** section below and install on your Android device.
          files: |
            app/build/outputs/apk/release/named/silphscope-pvp-${{ steps.version.outputs.tag }}.apk
          draft: false
          prerelease: false
          make_latest: "true"
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

