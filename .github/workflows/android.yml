name: Build Android APK

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Build Target'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
          - both

      workflow_version:
        description: 'Optional release version override (e.g. v1.01)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Release Version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.workflow_version }}" ]; then
            RAW_VER="${{ github.event.inputs.workflow_version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RAW_VER="${{ github.ref_name }}"
          elif [ -f VERSION ]; then
            RAW_VER=$(cat VERSION | tr -d '[:space:]')
          else
            RAW_VER="v1.00"
          fi
          CLEAN_NUM="${RAW_VER#v}"
          TAG_NAME="v${CLEAN_NUM}"
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "version_num=${CLEAN_NUM}" >> $GITHUB_OUTPUT
          echo "Resolved release version: ${TAG_NAME}"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: |
          chmod +x gradlew

      - name: Verify or Generate Release Keystore
        run: |
          if [ ! -f app/release.keystore ]; then
            echo "Generating release keystore via keytool..."
            keytool -genkeypair -v \
              -keystore app/release.keystore \
              -alias gblkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass gblrelease123 \
              -keypass gblrelease123 \
              -dname "CN=SilphScope PvP, OU=Android, O=SilphScope, C=US"
          else
            echo "Release keystore is present at app/release.keystore"
          fi

      - name: Build Release APK
        if: github.event.inputs.build_target == 'release' || github.event.inputs.build_target == 'both' || github.event.inputs.build_target == '' || github.event_name == 'push'
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare Named Release APK for Public Download
        if: github.event.inputs.build_target == 'release' || github.event.inputs.build_target == 'both' || github.event.inputs.build_target == '' || github.event_name == 'push'
        run: |
          mkdir -p app/build/outputs/apk/release/named
          cp app/build/outputs/apk/release/*.apk "app/build/outputs/apk/release/named/silphscope-pvp-${{ steps.version.outputs.tag }}.apk"

      - name: Build Debug APK
        if: github.event.inputs.build_target == 'debug' || github.event.inputs.build_target == 'both'
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: silphscope-pvp-release-apk
          path: app/build/outputs/apk/release/named/silphscope-pvp-*.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: always() && (github.event.inputs.build_target == 'debug' || github.event.inputs.build_target == 'both')
        with:
          name: silphscope-pvp-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish Official GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "SilphScope PvP ${{ steps.version.outputs.tag }}"
          body: |
            ## SilphScope PvP ${{ steps.version.outputs.tag }} — Official v3.13 Release (Best-Match-Across-Team Player Switch OCR Fix & Single-Tap Stop Overlay Button Fix)
            
            ### What's New in v3.13
            - **Best-Match-Across-Team Player Switch OCR (`handlePlayerSwitchLines` & `scoreTeamMemberOnLine`)**:
              - Replaced sequential slot-order matching (which evaluated Slot 0 / Lead first and returned on the first fuzzy or shared-CP match) with simultaneous scoring across all 3 team Pokémon to select the strictly best match across the entire team regardless of slot order (e.g., `Tinkaton / Mimikyu / Swampert` or `Swampert / Mimikyu / Tinkaton`).
              - Added High-Contrast B&W nameplate extraction (`createHighContrastWhiteTextBitmap`) for the top-left player nameplate and full 5-variant OCR confusable normalization (`rn -> m`, `1 -> i/l`, `0 -> o`, `v -> y`, `vv -> w`) so `"Swarnpert"` normalizes to `"swampert"` (exact match, score `0`).
              - Added horizontal chip-bar rejection and strict fuzzy length guards so 6-character overlay team chips (`Tinkat`, `Mimiky`, `Swampe`) or shared default CPs can never false-switch back to the Lead.
            - **Single-Tap "Stop Battle Overlay" Button Fix (`MainActivity`)**:
              - Synchronously clears `OverlayService.isInstanceRunning` and updates `MainActivity` button state on the first tap of **Stop Battle Overlay** (plus live `onRunningStateChanged` callback), eliminating the need to tap Stop twice to restore **Start Battle Overlay**.
            - **Top-5 Role Upgrade Recommendations (`Top-200` Candidate Pool vs. `Top-100` Blended Meta)**:
              - Displays the **Top 5 distinct-species upgrade alternatives per role** (`#1 Lead`, `#2 Safe Swap`, `#3 Closer`) with one-tap replacement chips inside the Create Team and Edit Team dialogs.
              - Simulates the **Top 200 Meta Pokémon** for the active league (including eligible Shadows and enforcing the GBL species clause) against the **Top 100** blended current-season meta distribution.
            - **Renamed `Mach BR` (`Machine Aggregate BR`) → `Core BR` (`Core Coverage BR`)**:
              - Replaced unclear `Mach BR` / `Machine Aggregate BR` terminology with **`Core BR`** / **`Core Coverage BR (Core BR — 3-Mon Team Ceiling)`** across team preset cards, Team Editor badges, role upgrade chips, and Settings threshold scales.
            - **Enhanced Mimikyu (`Disguise`) & Aegislash (`Stance Change`) Battle Ranking Math**:
              - **Mimikyu (`Disguise`)**: Computes the exact average of **(a) using all Protect Shields before busting Disguise** and **(b) busting Disguise first before using Protect Shields**, while modeling that opponents always throw their **fastest (lowest-energy) Charged Attack** until Disguise is busted.
              - **Aegislash (`Shield ⇄ Sword Forme`)**: Models the shift in **both damage AND energy generation** between Shield Forme (`97 Atk / 291 Def`, `1 HP` fast damage, boosted `1.28x` high energy generation) and Sword/Blade Forme (`291 Atk / 97 Def`, full `291 Atk` fast & charged damage, lower energy generation rate until reverting via Protect Shield).
              - **Morpeko (`Aura Wheel`) & Cramorant (`Gulp Missile`)**: Full support for alternating Electric/Dark STAB + `+1 Atk` buff cycles and Gulping/Gorging retaliation damage + `-1 Def / -1 Atk` debuffs.
            - **Auto Team Style Detection (`ABB` vs. `ABC`), Non-Blocking Background Sim & Position-Weighted Shield Ratings**:
              - Instantaneous background thread evaluation, `[ABB]` / `[ABC]` style classification, safe swap slot reordering, and current-season blended meta distribution with exponential recency decay.
            
            ### Download & Install
            Download **`silphscope-pvp-${{ steps.version.outputs.tag }}.apk`** from the **Assets** section below and install on your Android device.
          files: |
            app/build/outputs/apk/release/named/silphscope-pvp-${{ steps.version.outputs.tag }}.apk
          draft: false
          prerelease: false
          make_latest: "true"
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

