name: Build Android APK

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Build Target'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
          - both

      workflow_version:
        description: 'Optional release version override (e.g. v1.01)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Release Version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.workflow_version }}" ]; then
            RAW_VER="${{ github.event.inputs.workflow_version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RAW_VER="${{ github.ref_name }}"
          elif [ -f VERSION ]; then
            RAW_VER=$(cat VERSION | tr -d '[:space:]')
          else
            RAW_VER="v1.00"
          fi
          CLEAN_NUM="${RAW_VER#v}"
          TAG_NAME="v${CLEAN_NUM}"
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "version_num=${CLEAN_NUM}" >> $GITHUB_OUTPUT
          echo "Resolved release version: ${TAG_NAME}"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: |
          chmod +x gradlew

      - name: Verify or Generate Release Keystore
        run: |
          if [ ! -f app/release.keystore ]; then
            echo "Generating release keystore via keytool..."
            keytool -genkeypair -v \
              -keystore app/release.keystore \
              -alias gblkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass gblrelease123 \
              -keypass gblrelease123 \
              -dname "CN=SilphScope PvP, OU=Android, O=SilphScope, C=US"
          else
            echo "Release keystore is present at app/release.keystore"
          fi

      - name: Build Release APK
        if: github.event.inputs.build_target == 'release' || github.event.inputs.build_target == 'both' || github.event.inputs.build_target == '' || github.event_name == 'push'
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare Named Release APK for Public Download
        if: github.event.inputs.build_target == 'release' || github.event.inputs.build_target == 'both' || github.event.inputs.build_target == '' || github.event_name == 'push'
        run: |
          mkdir -p app/build/outputs/apk/release/named
          cp app/build/outputs/apk/release/*.apk "app/build/outputs/apk/release/named/silphscope-pvp-${{ steps.version.outputs.tag }}.apk"

      - name: Build Debug APK
        if: github.event.inputs.build_target == 'debug' || github.event.inputs.build_target == 'both'
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: silphscope-pvp-release-apk
          path: app/build/outputs/apk/release/named/silphscope-pvp-*.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: always() && (github.event.inputs.build_target == 'debug' || github.event.inputs.build_target == 'both')
        with:
          name: silphscope-pvp-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish Official GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "SilphScope PvP ${{ steps.version.outputs.tag }}"
          body: |
            ## SilphScope PvP ${{ steps.version.outputs.tag }} — Official v3.31 Release (Top-50 Core Breaker & Threat Analysis Depth + Streamlined Team Summary Cards)
            
            ### What's New in v3.31
            - **Expanded Core Breakers & Threat Analysis Depth to Top 50 Meta (`OverlayService.kt`, `gblData.ts`, `MainActivity.kt`, `App.tsx`)**:
              - Expanded **Key Wins**, **Key Threats (with Slot 1/2/3 BRs)**, and **Core Breakers (with Slot 1/2/3 BRs)** evaluation from the Top 25 meta threats to the **Top 50 meta threats** across both the Anti-Meta Team Builder and Team Evaluator/Editor.
            - **Decluttered Team Summary / Presets Page (`MainActivity.kt`, `App.tsx`)**:
              - Removed movesets, alt-moveset comparison notes, and long paragraph descriptions from the main Team Summary cards so you can scan your saved teams at a glance.
              - Team Summary cards now cleanly display **Pokémon names, IVs (and CP), roles (`[Lead]`, `[Safe Swap]`, `[Closer]`, `[A] Lead`, `[Core 1] Lead`, etc.), Key Wins, Key Threats, and Core Breakers**, while preserving full movesets and strategy descriptions inside the **Anti-Meta Team Builder** and **Team Editor** views.
            - **Fixed Overlay Battle Recommendation Row (`OverlayService.kt`, `overlay.html`)**:
              - Fixed the payload key mapping between `OverlayService.kt` and `overlay.html` (`tacticalRec` / `tacticalRecommendation` and `showTacticalRec` / `showTacticalRecommendations`) and added a client-side 3v3 matrix fallback so the ultra-compact **Lead & Swap Tactical Recommendation Row** (`[Archetype] Action · [Shield Plan] · Goal` + 1-tap `Swap ➔` button) reliably displays between the `VS [OPPONENT]` header row and the `Start/Stop Battle` toolbar row.
            - **Includes All v3.30 Upgrades**:
              - **Duo-Core (`DUO`)** team creation & auto-detection (`Best 5 ABB`, `Best 5 ABC`, `Best 5 Duo-Core`) and **2-Frame Continual Shield Monitoring & Restoration**.
            
            ### Live Web Simulator & Download
            - **Live Web Simulator**: [https://sportsfan986.github.io/silphscope-pvp/](https://sportsfan986.github.io/silphscope-pvp/)
            - **Android APK**: Download **`silphscope-pvp-${{ steps.version.outputs.tag }}.apk`** from the **Assets** section below and install on your Android device.
          files: |
            app/build/outputs/apk/release/named/silphscope-pvp-${{ steps.version.outputs.tag }}.apk
          draft: false
          prerelease: false
          make_latest: "true"
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

