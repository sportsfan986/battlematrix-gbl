name: Build Android APK

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Build Target'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
          - both

      workflow_version:
        description: 'Optional release version override (e.g. v1.01)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Release Version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.workflow_version }}" ]; then
            RAW_VER="${{ github.event.inputs.workflow_version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RAW_VER="${{ github.ref_name }}"
          elif [ -f VERSION ]; then
            RAW_VER=$(cat VERSION | tr -d '[:space:]')
          else
            RAW_VER="v1.00"
          fi
          CLEAN_NUM="${RAW_VER#v}"
          TAG_NAME="v${CLEAN_NUM}"
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "version_num=${CLEAN_NUM}" >> $GITHUB_OUTPUT
          echo "Resolved release version: ${TAG_NAME}"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: |
          chmod +x gradlew

      - name: Verify or Generate Release Keystore
        run: |
          if [ ! -f app/release.keystore ]; then
            echo "Generating release keystore via keytool..."
            keytool -genkeypair -v \
              -keystore app/release.keystore \
              -alias gblkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass gblrelease123 \
              -keypass gblrelease123 \
              -dname "CN=SilphScope PvP, OU=Android, O=SilphScope, C=US"
          else
            echo "Release keystore is present at app/release.keystore"
          fi

      - name: Build Release APK
        if: github.event.inputs.build_target == 'release' || github.event.inputs.build_target == 'both' || github.event.inputs.build_target == '' || github.event_name == 'push'
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare Named Release APK for Public Download
        if: github.event.inputs.build_target == 'release' || github.event.inputs.build_target == 'both' || github.event.inputs.build_target == '' || github.event_name == 'push'
        run: |
          mkdir -p app/build/outputs/apk/release/named
          cp app/build/outputs/apk/release/*.apk "app/build/outputs/apk/release/named/silphscope-pvp-${{ steps.version.outputs.tag }}.apk"

      - name: Build Debug APK
        if: github.event.inputs.build_target == 'debug' || github.event.inputs.build_target == 'both'
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: silphscope-pvp-release-apk
          path: app/build/outputs/apk/release/named/silphscope-pvp-*.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: always() && (github.event.inputs.build_target == 'debug' || github.event.inputs.build_target == 'both')
        with:
          name: silphscope-pvp-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish Official GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "SilphScope PvP ${{ steps.version.outputs.tag }}"
          body: |
            ## SilphScope PvP ${{ steps.version.outputs.tag }} — Official v3.13 Release (Scanner Charged Move Stability, Swampert & Mimikyu OCR Hardening, Fainted Slot Resurrection Guard)
            
            ### What's New in v3.13
            - **Scanner Charged Move Stability & Elimination of Player Flip-Flop**:
              - Fixed an issue where throwing or receiving a Charged Move while using a swapped Pokémon (e.g. Swampert) caused the overlay scanner to falsely revert to a previously active/fainted team member (e.g. Tinkaton) for several seconds.
              - Prioritized **Bottom Move Button matching**: active Pokémon moves (e.g. Hydro Cannon / Earthquake) are detected with 0 delay and keep the active slot locked.
              - Added **2-Frame Debouncing Hysteresis** to top nameplate OCR: switches detected via top nameplate alone require 2 consecutive confirmed frames, preventing single-frame visual noise, particle effects, or minigame prompts ("CHARGED ATTACK", "USE SHIELD", "PROTECT") from flipping active Pokémon.
            - **Fainted Slot Guard (Dead Pokémon Cannot Switch In)**:
              - Ensured `handlePlayerSwitchLines` skips any slot marked fainted (`playerFaintedSlots[slotIdx] == true`), preventing OCR noise or toast text from resurrecting fallen teammates.
            - **Full Vertical Toast Blackout Masking & Extended Self-Text Filtering**:
              - Expanded screen capture toast masking to dynamically cover the full vertical extent of the status toast (`h * 0.095f`), preventing ML Kit from reading truncated self-toasts (e.g. `"Player Faint Swap: Tinkaton → Swampert"`).
              - Enhanced `isOverlayHudSelfText` to filter all faint swap, player switch, shield used, and charged attack minigame phrases.
            - **Dual Raw + High-Contrast B&W Player Nameplate Stitching**:
              - Added high-contrast white text extraction for `srcPlayer` (identical to `srcOpp`), ensuring pure white nameplate text over bright/swirling stadium backgrounds is recognized crisply.
            - **Multi-Variant OCR Normalization (`rnAsM` / `vAsY` / `oneAsL`)**:
              - Extended OCR token normalization so condensed font confusions (`swarnpert` → `swampert`, `rnirnikvu` → `mimikyu`) match reliably on the player's team.
            - **Resolved TypeScript Build & Linter Issues**:
              - Exported `TeamArchetype` in `src/data/gblData.ts`, added `newMachineAggBr` property to `RoleUpgradeSuggestion`, and removed duplicate `Mimikyu` object literal entry.
            
            ### Download & Install
            Download **`silphscope-pvp-${{ steps.version.outputs.tag }}.apk`** from the **Assets** section below and install on your Android device.
          files: |
            app/build/outputs/apk/release/named/silphscope-pvp-${{ steps.version.outputs.tag }}.apk
          draft: false
          prerelease: false
          make_latest: "true"
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

